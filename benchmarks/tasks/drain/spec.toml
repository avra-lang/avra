# Drain a bounded channel: the SHAPED row, not just latency. An O(n^2)
# drain hides behind a small-n latency number; the same drain at 1000 and
# 10000 items, reported per item, exposes the scaling.
languages = ["c", "rust", "go", "python"]

[benchmark]
name = "drain"
family = "tasks"
title = "Bounded-channel drain"
invariant = "a producer pushes n items into a bounded channel of capacity cap while one consumer drains it; every item arrives exactly once, in FIFO order, so the sum is n(n-1)/2 and none is dropped"
row = "wall-clock nanoseconds per item for the drain, at two sizes, plus the ratio of the large per-item cost to the small one"

[workload]
small = 1000
n = 10000
cap = 64
rounds = 5

[rows.drain_1k_ns_per_op]
unit = "ns"
about = "nanoseconds per item draining 1000 items through a capacity-64 channel"

[rows.drain_10k_ns_per_op]
unit = "ns"
about = "nanoseconds per item draining 10000 items through a capacity-64 channel"

[rows.drain_scale]
unit = "x"
about = "the large per-item cost over the small one — a linear drain reports about 1, an O(n^2) drain about (n/small)"

[rows.drain_ops_per_s]
unit = "ops"
about = "items drained per second at 10000 items — the throughput"

[rows.drain_bytes]
unit = "bytes"
about = "payload bytes moved at 10000 items (8 per item)"

[rows.drain_sum]
unit = "ops"
about = "the sum of every drained item — a witness every item arrived exactly once"

[gate.rows]
drain_scale = 3.0

[notes]
text = "This is the suite's scaling witness: a pure latency row cannot tell a linear drain from a quadratic one, and the audit of Avra's own carrier found one."
