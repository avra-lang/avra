# Spawn cost: create N tasks and join them.
languages = ["c", "rust", "go", "python", "avra"]

[benchmark]
name = "spawn"
family = "tasks"
title = "Spawn cost"
invariant = "every spawned task runs to completion and its answer is joined exactly once, so the sum of answers equals 0+1+...+(n-1) = n(n-1)/2"
row = "wall-clock nanoseconds per task to create and join; once one at a time, once all alive at once"

[workload]
n = 10000
rounds = 5

[rows.spawn_one]
unit = "ns"
about = "create and join one task at a time, n times"

[rows.spawn_alive]
unit = "ns"
about = "create n tasks alive at once, then join every one"

[rows.spawn_sum]
unit = "ops"
check = "exact"
about = "the sum of the joined answers — a witness the tasks all ran and were joined once"

[notes]
text = "C, Rust and Python create an OS thread per task; Go and Avra schedule lightweight tasks. That difference is the measurement, not a defect in the twins."
