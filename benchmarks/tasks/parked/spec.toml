# Memory per parked task: N tasks alive and blocked, and the resident set
# that costs.
languages = ["c", "rust", "go"]

[benchmark]
name = "parked"
family = "tasks"
title = "Memory per parked task"
invariant = "n tasks are spawned and blocked on a channel, then released; every one runs and its answer is joined, so the sum is 0+1+...+(n-1)"
row = "resident bytes the process holds per parked task (read from the process's own status before and after)"

[workload]
n = 10000
rounds = 3

[rows.parked_bytes]
unit = "bytes"
about = "resident bytes per parked task, the process's growth over the parked run"

[rows.parked_n]
unit = "ops"
check = "exact"
about = "tasks parked — a witness the whole set was alive"

[notes]
text = "RSS is coarse and machine-dependent: an un-touched thread stack costs no resident page, so an OS-thread twin parks cheaply until it touches. Read this row as a floor, not a promise."
