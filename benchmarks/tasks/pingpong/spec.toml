# Ping-pong latency: two tasks pass a value.
languages = ["c", "rust", "go", "python", "avra"]

[benchmark]
name = "pingpong"
family = "tasks"
title = "Ping-pong latency"
invariant = "two tasks alternate n round trips over a rendezvous; every send is received exactly once and in order, so the exchange count is 2n at the end"
row = "wall-clock nanoseconds per round trip: one task signals, the other answers"

[workload]
n = 100000
rounds = 5

[analogues]
c = "OS threads, a mutex and condition variable rendezvous on both legs"
rust = "OS threads, two rendezvous sync_channels"
python = "OS threads, two one-slot queues"
go = "goroutines, two unbuffered channels"
avra = "user-space tasks, two rendezvous channels (`open_channel<int>(0)`)"

[rows.pingpong_ns]
unit = "ns"
about = "nanoseconds per round trip, the least of `rounds` rallies"

[rows.pingpong_rounds]
unit = "ops"
check = "exact"
about = "the round trips run — a witness the rally was not cut short"

[notes]
text = "A round trip is a rendezvous on both legs: the sender parks until the receiver takes the value and parks until the answer returns."
