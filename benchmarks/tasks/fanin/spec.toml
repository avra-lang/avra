# Fan-in: N producers send to one consumer over a bounded channel.
languages = ["c", "rust", "go", "python"]

[benchmark]
name = "fanin"
family = "tasks"
title = "Fan-in over N producers"
invariant = "each of n_producers tasks sends n_per values to one consumer; every value sent arrives exactly once, none is dropped or duplicated, so the received count is n_producers*n_per"
row = "wall-clock nanoseconds per value received"

[workload]
producers = 8
per = 6250
cap = 64
rounds = 5

[rows.fanin_ns_per_op]
unit = "ns"
about = "nanoseconds per value, from the first send to the last receive"

[rows.fanin_received]
unit = "ops"
about = "values the consumer received — must equal n_producers*per"

[rows.fanin_dropped]
unit = "ops"
about = "sent minus received — must be 0"

[notes]
text = "A select over N ready sources is a language feature, not every language's shape; the fan-in invariant is what all four can satisfy, so that is the row. Go's select is exercised by its own twin's notes."
