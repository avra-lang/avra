# Fan-in: N producers send to one consumer over a bounded channel.
languages = ["c", "rust", "go", "python", "avra"]

[benchmark]
name = "fanin"
family = "tasks"
title = "Fan-in over N producers"
invariant = "each of n_producers tasks sends n_per values to one consumer; every value sent arrives exactly once, none is dropped or duplicated, so the received count is n_producers*n_per"
row = "wall-clock nanoseconds per value received"

[workload]
producers = 8
per = 6250
cap = 64
sweep = 1048576
rounds = 5

[analogues]
c = "OS threads (one producer per pthread), one bounded channel"
rust = "OS threads (one producer per std::thread), one bounded sync_channel"
python = "OS threads (one producer per threading.Thread), one bounded queue"
go = "goroutines (one producer each), one buffered channel"
avra = "user-space tasks (one channel each), a single `select` over 8 sources"

[rows.fanin_ns_per_op]
unit = "ns"
about = "nanoseconds per value, from the first send to the last receive"

[rows.fanin_received]
unit = "ops"
check = "exact"
about = "values the consumer received — must equal n_producers*per"

[rows.fanin_dropped]
unit = "ops"
check = "exact"
about = "sent minus received — must be 0"

[rows.fanin_p1_ns_per_op]
unit = "ns"
about = "nanoseconds per value over BENCH_SWEEP values at 1 producer (Go)"

[rows.fanin_p8_ns_per_op]
unit = "ns"
about = "the same at 8 producers (Go)"

[rows.fanin_p64_ns_per_op]
unit = "ns"
about = "the same at 64 producers (Go)"

[rows.fanin_p1024_ns_per_op]
unit = "ns"
about = "the same at 1024 producers (Go)"

[notes]
text = "A select over N ready sources is a language feature, not every language's shape; the fan-in invariant is what all four can satisfy, so that is the row. Go's select is exercised by its own twin's notes."
