[package]
name        = "@std/json"
version     = "0.0.1"
description = "JSON as a value: read from text, written back compact or pretty — the projection format the tools speak"

[lib]
name = "std-json"
path = "src/json.av"

[dependencies]
"@std/text"   = { path = "../std-text" }
"@std/errors" = { path = "../std-errors" }

# The program test prints its lines.
[dev-dependencies]
"@std/io" = { path = "../std-io" }
