[package]
name        = "width-witness"
version     = "0.0.1"
description = "The extern seam's width witness: C bodies that answer narrower than 64 bits"

# A `[link]` section makes this package's own C readable to `make
# externs`, which checks every declaration below against the real
# prototype beside it — the same check the compiler's runtime gets.
# `objects` is what the link needs until a package can build its own
# native sources (ROADMAP: B7); the Makefile builds it meanwhile.
[link]
objects = ["../../build/width_witness.o"]
