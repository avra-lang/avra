[package]
name        = "@std/sqlite"
version     = "0.0.1"
description = "SQLite, vendored and compiled in: the database is a file and the driver is in the binary"

[lib]
name = "std-sqlite"
path = "src/sqlite.av"

# THE WALL's other half: src/c/ declares the `sqlite3_*` prototypes;
# these keep the promise at link time. `-lm` and `-lpthread` live in
# libSystem on darwin and are required on Linux and BSD. A program's native link carries
# `-lm` itself; `m` here is for the package's own shared library (`wisp libs`).
[link]
objects = ["../../build/sqlite3.o", "../../build/sqlite_sentinel.o"]
headers = ["src/c/sqlite_sentinel.c", "vendor/sqlite3.h"]
include = ["vendor"]
# The macros sqlite3.c is compiled under, which its header is read under too (vendor/FLAGS.md says
# why each is on); the Makefile reads them from here.
defines = [
    "SQLITE_ENABLE_COLUMN_METADATA=1",
    "SQLITE_ENABLE_PREUPDATE_HOOK=1",
    "SQLITE_ENABLE_SESSION=1",
    "SQLITE_ENABLE_SNAPSHOT=1",
    "SQLITE_ENABLE_NORMALIZE=1",
    "SQLITE_ENABLE_STMT_SCANSTATUS=1",
    "SQLITE_ENABLE_UNLOCK_NOTIFY=1",
    "SQLITE_ENABLE_FTS5=1",
    "SQLITE_ENABLE_RTREE=1",
    "SQLITE_ENABLE_GEOPOLY=1",
    "SQLITE_ENABLE_MATH_FUNCTIONS=1",
    "SQLITE_ENABLE_DBSTAT_VTAB=1",
    "SQLITE_ENABLE_DBPAGE_VTAB=1",
    "SQLITE_ENABLE_BYTECODE_VTAB=1",
    "SQLITE_ENABLE_STAT4=1",
    "SQLITE_ENABLE_EXPLAIN_COMMENTS=1",
    "SQLITE_ENABLE_OFFSET_SQL_FUNC=1",
    "SQLITE_DQS=0",
    "SQLITE_ENABLE_API_ARMOR=1",
    "SQLITE_LIKE_DOESNT_MATCH_BLOBS=1",
    "SQLITE_STRICT_SUBTYPE=1",
    "SQLITE_DEFAULT_FOREIGN_KEYS=1",
    "SQLITE_THREADSAFE=1",
    "SQLITE_MAX_EXPR_DEPTH=1000",
    "SQLITE_DEFAULT_MEMSTATUS=0",
    "SQLITE_DEFAULT_MMAP_SIZE=268435456",
    "SQLITE_MAX_MMAP_SIZE=1099511627776",
    "SQLITE_DEFAULT_CACHE_SIZE=-8000",
    "SQLITE_DEFAULT_WORKER_THREADS=0",
    "NDEBUG=1",
]
libs    = ["m", "pthread"]
