[package]
name        = "@std/sqlite"
version     = "0.0.1"
description = "SQLite, vendored and compiled in: the database is a file and the driver is in the binary"

[lib]
name = "std-sqlite"
path = "src/sqlite.av"

[dependencies]
"@std/errors" = { path = "../std-errors" }
"@std/text"   = { path = "../std-text" }

# The connection suite makes and removes real files: a database SQLite
# creates, a text file that is not one. The driver itself touches no
# filesystem except through SQLite.
[dev-dependencies]
"@std/io" = { path = "../std-io" }

# THE WALL's other half: src/c/ declares the `sqlite3_*` prototypes;
# these keep the promise at link time. `-lm` and `-lpthread` live in
# libSystem on darwin and are required on Linux and BSD.
[link]
objects = ["../../build/sqlite3.o"]
flags   = ["-lm", "-lpthread"]
