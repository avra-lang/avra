[package]
name        = "@std/time"
version     = "0.0.1"
description = "Durations as values, and the monotonic clock"

[lib]
name = "std-time"
path = "src/time.av"

# The package's own C: the wall clock, answering an int.
[link]
objects = ["../../build/std_time.o"]
wasm_objects = ["../../build/wasm32/std_time.o"]

[dependencies]
"@std/json" = { path = "../std-json" }
