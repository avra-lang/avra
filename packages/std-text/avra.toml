[package]
name        = "@std/text"
version     = "0.0.1"
description = "Text built and shaped: a linear builder, padding and repetition, lines, and the code-point walk"

[lib]
name = "std-text"
path = "src/text.av"

# The program test prints its lines. A dev dependency serves the tests
# and never travels, so this edge is theirs: @std/io reads @std/text.
[dev-dependencies]
"@std/io" = { path = "../std-io" }
