[package]
name        = "@std/net"
version     = "0.0.1"
description = "Stream sockets and readiness as values: a listener, a connection, a poller, and the errno each verb can answer"

[lib]
name = "std-net"
path = "src/net.av"


# The package's own C: sockets, the readiness queue and the resolver's
# helper thread, answering ints. Bytes cross through the runtime's
# descriptor rows, never through here. `pthread` lives in libSystem on
# darwin and is named for Linux and BSD.
[link]
objects = ["../../build/std_net.o"]
libs    = ["pthread"]
