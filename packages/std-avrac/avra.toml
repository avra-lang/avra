[package]
name        = "@std/avrac"
version     = "0.0.1"
description = "Avra compiler library"
# bs2's test runner, vendored where bs2 reads it — never ours to compile
exclude     = ["src/features/spec_test"]

[lib]
name = "std-avrac"
path = "src/avrac.av"

[dependencies]
"@std/errors" = { path = "../std-errors" }
"@std/toml"   = { path = "../std-toml" }
"@std/testing" = { path = "../std-testing" }

# THE HOST SEAM's other half: language/llvm_api.av declares the C
# binding's prototypes; these keep the promise at link time. The
# LLVM prefix matches the Makefile's LLVM_PREFIX default.
[link]
objects = ["../../build/llvm_wrapper.o"]
flags   = ["-L/opt/homebrew/opt/llvm/lib", "-lLLVM"]
