[package]
name        = "@std/process"
version     = "0.0.1"
description = "Child processes: the program is the authority, the words are data"

[lib]
name = "std-process"
path = "src/process.av"

# The package's own C: the stage for a spawn's words, and the facts
# only the host can answer — every entry point answering an int.
[link]
objects = ["../../build/std_process.o"]
