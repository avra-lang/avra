[package]
name        = "@std/compress"
version     = "0.0.1"
description = "gzip, zlib and brotli: octets encoded, and decoded under a ceiling — vendored zlib and brotli compiled in"

[lib]
name = "std-compress"
path = "src/compress.av"

# The package's own C and the vendored zlib and brotli, one object per
# upstream unit, archived so a program links the members it reaches.
# brotli's encoder reads libm. A program's native link carries `-lm` itself; this row is for
# the package's own shared library (tools/libs.py), which names what it needs.
[link]
objects = ["../../build/std_compress.a"]
libs    = ["m"]
