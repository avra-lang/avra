[package]
name        = "cli"
version     = "0.0.1"
description = "The avra command"

# The compiler is where diagnosis happens: its release build links the
# runtime's instruments (AVRA_MEM_STATS, the reference guard, the census)
# and the machine's memory pool, which a program that asks for neither
# never carries.
[build]
instruments = true

# The one program the compiler runs: the C compiler that links. `CC`
# names it, else `clang` on the PATH. `avra process` prints it.
[process.tools]
clang = { from = "env", var = "CC", default = "clang", terminator = "--" }
wasm-opt = { from = "env", var = "WASM_OPT", default = "wasm-opt", terminator = "--" }
