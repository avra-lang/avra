[package]
name        = "cli"
version     = "0.0.1"
description = "The avra command"

[dependencies]
"@std/avrac" = { path = "../std-avrac" }
"@std/cli"   = { path = "../std-cli" }
"@std/toml"  = { path = "../std-toml" }
"@std/testing" = { path = "../std-testing" }
"@std/process" = { path = "../std-process" }
"@std/time"    = { path = "../std-time" }
"@std/errors"  = { path = "../std-errors" }

# The one program the compiler runs: the C compiler that links. `CC`
# names it, else `clang` on the PATH. `avra explain process` prints it.
[process.tools]
clang = { from = "env", var = "CC", default = "clang", terminator = "--" }
