[package]
name        = "cli"
version     = "0.0.1"
description = "The avra command"

# The one program the compiler runs: the C compiler that links. `CC`
# names it, else `clang` on the PATH. `avra process` prints it.
[process.tools]
clang = { from = "env", var = "CC", default = "clang", terminator = "--" }
