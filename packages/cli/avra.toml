# The [dependencies] entries exist so the CLI compile unit's cache
# key includes every package this src/ imports — without them bs2
# keys the unit on main.av's bytes alone, and edits to the compiler
# serve a STALE avra silently (the bootstrap cli manifest documents
# this same trap).
[package]
name        = "cli"
version     = "0.0.1"
description = "The avra command"

[dependencies]
"@std/avrac" = { path = "../std-avrac" }
"@std/cli"   = { path = "../std-cli" }
