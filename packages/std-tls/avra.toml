[package]
name        = "@std/tls"
version     = "0.0.1"
description = "TLS 1.2 and 1.3 over any byte stream, client and server, with vendored mbedTLS compiled in"

[lib]
name = "std-tls"
path = "src/tls.av"

# The package's own C and the vendored mbedTLS, one object per unit,
# archived so a program links the members it reaches.
[link]
objects = ["../../build/std_tls.a"]
