[package]
name        = "@std/tls"
version     = "0.0.1"
description = "TLS 1.2 and 1.3 over any byte stream, client and server, with vendored mbedTLS compiled in"

[lib]
name = "std-tls"
path = "src/tls.av"

# The package's own C over the vendored mbedTLS, archived one object
# per upstream unit so a program links the members it reaches.
[link]
objects = ["../../build/std_tls.o", "../../build/mbedtls.a"]
