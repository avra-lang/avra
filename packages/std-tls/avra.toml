[package]
name        = "@std/tls"
version     = "0.0.1"
description = "TLS 1.2 and 1.3 over any byte stream, client and server, with vendored mbedTLS compiled in"

[lib]
name = "std-tls"
path = "src/tls.av"

# The package's own C and the vendored mbedTLS, one object per unit,
# archived so a program links the members it reaches; the include and
# defines rows are what every unit is compiled with, the build's and a
# header read's alike.
[link]
headers = ["src/c/std_tls.c", "src/c/std_tls_mac.c"]
include = [
    "vendor/mbedtls/include",
    "vendor/mbedtls/tf-psa-crypto/include",
    "vendor/mbedtls/tf-psa-crypto/drivers/builtin/include",
    "vendor/mbedtls/library",
    "vendor/mbedtls/tf-psa-crypto/core",
    "vendor/mbedtls/tf-psa-crypto/dispatch",
    "vendor/mbedtls/tf-psa-crypto/drivers/builtin/src",
    "vendor/mbedtls/tf-psa-crypto/extras",
    "vendor/mbedtls/tf-psa-crypto/platform",
    "vendor/mbedtls/tf-psa-crypto/utilities",
    "vendor/mbedtls/tf-psa-crypto/drivers/everest/include",
    "vendor/mbedtls/tf-psa-crypto/drivers/everest/include/tf-psa-crypto/private/everest",
    "vendor/mbedtls/tf-psa-crypto/drivers/everest/include/tf-psa-crypto/private/everest/kremlib",
    "src/c",
]
defines = ["TF_PSA_CRYPTO_CONFIG_FILE=<std_tls_crypto_config.h>", "MBEDTLS_CONFIG_FILE=<std_tls_ssl_config.h>"]
objects = ["../../build/std_tls.a"]
