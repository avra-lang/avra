[package]
name        = "@std/hash"
version     = "0.0.1"
description = "BLAKE3: the content digest, one-shot or incremental — the vendored reference, SIMD chosen at run time"

[lib]
name = "std-hash"
path = "src/hash.av"

# The package's own C and the vendored BLAKE3, one object per upstream
