[package]
name        = "@std/io"
version     = "0.0.1"
description = "The host's streams, files and environment, as values"

[lib]
name = "std-io"
path = "src/io.av"

# The package's own C: opening, standing, making, removing, and the two
# halves of a durable write — every entry point answering an int.
[link]
objects = ["../../build/std_io.o"]
wasm_objects = ["../../build/wasm32/std_io.o"]
