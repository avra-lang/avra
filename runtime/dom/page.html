<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style><!--STYLE--></style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createApplier, instantiate } from "./bootstrap.js";

const mount = document.getElementById("app");
let mod = null;
const applier = createApplier(document, mount, (who, what) => mod && mod.avra_event(who, what));
mod = await instantiate("./app.wasm", {
  "avra:rt": {
    avra_dom_frame: (frame) => { applier(frame.bytes()); frame.release(); },
  },
});
</script>
</body>
</html>
