[package]
name        = "@ui/board"
version     = "0.1.0"
description = "The task board: one view, mounted on a page (its own program) and in a terminal (term/)"

[dev]
server = "server"

[dependencies]
"@ui/board_model" = { path = "model" }

[lib]
name = "ui-board"
path = "src/board.av"

[bin]
name = "ui-board-web"
path = "src/main.av"
