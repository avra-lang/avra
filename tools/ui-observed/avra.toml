[package]
name        = "@ui/observed"
version     = "0.1.0"
description = "A page of two views that ask the same GET, beside the server that answers it. Served by tools/ui_board_browser.sh to prove the page sends one request, and asks again with the version it holds."

[dev]
server = "server"

[bin]
name = "ui-observed-web"
path = "src/main.av"
