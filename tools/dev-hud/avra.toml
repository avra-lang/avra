[package]
name        = "@dev/hud"
version     = "0.1.0"
description = "The dev panel: the cache of the page being developed, drawn from what its dev server tells. Its own module, started beside the app by `avra dev` (page/), so a wedged app cannot take it down."

[lib]
name = "dev-hud"
path = "src/hud.av"
