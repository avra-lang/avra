# a program over @std/json — the same lines natively and under the
# evaluator: text read into a value, walked, and written back
[package]
name    = "json_corpus"
version = "0.1.0"

[dependencies]
"@std/json" = { path = "../../packages/std-json" }
"@std/io"     = { path = "../../packages/std-io" }
"@std/errors" = { path = "../../packages/std-errors" }
