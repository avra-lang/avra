[package]
name        = "net-corpus"
version     = "0.0.1"
description = "the net rows end to end on loopback: listen, connect, accept, watch, wait, write, read, close"

# The program calls @std/net's C directly rather than through the
# package, so it links that object itself — a corpus dir proving a
# package's C is a linking package like any other. Without this the
# link fails on every `avra_net_*`, which is what it did.
[link]
objects = ["../../build/std_net.o"]
