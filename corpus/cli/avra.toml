# a program over @std/cli — the same lines natively and under the
# evaluator: help rendered from data, a line parsed, a verdict answered
[package]
name    = "cli_corpus"
version = "0.1.0"

[dependencies]
"@std/cli"    = { path = "../../packages/std-cli" }
"@std/io"     = { path = "../../packages/std-io" }
"@std/errors" = { path = "../../packages/std-errors" }
