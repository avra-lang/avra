[package]
name = "@avra/graph"
version = "0.1.0"
description = "An embedded, model-driven evidence graph"

[lib]
name = "avra-graph"
path = "src/api.av"

[bin]
name = "graph"
path = "src/main.av"

[dependencies]
"@avra/graph_contracts" = { path = "contracts" }
"@avra/cypher" = { path = "cypher" }
"@std/meta" = { path = "../packages/std-meta" }
"@std/validate" = { path = "../packages/std-validate" }
"@std/json" = { path = "../packages/std-json" }
"@std/sqlite" = { path = "../packages/std-sqlite" }
"@std/hash" = { path = "../packages/std-hash" }
"@std/cli" = { path = "../packages/std-cli" }
"@std/io" = { path = "../packages/std-io" }
"@std/http" = { path = "../packages/std-http" }
"@std/http_message" = { path = "../packages/std-http_message" }
"@std/net" = { path = "../packages/std-net" }
"@std/text" = { path = "../packages/std-text" }
"@std/process" = { path = "../packages/std-process" }
