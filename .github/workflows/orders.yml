# EIGHT ORDERS, EVERY NIGHT. A gate run runs each case in one order (the
# owner's ruling: `AVRA_SCHED_RUNS` stays 1 on every run, a suite
# whose tasks wait on real sockets paying each extra order in wall time);
# this runs every package's suite on main with `AVRA_SCHED_RUNS=8`, so an
# ordering bug is found here, by schedule, with the number that replays it.
# A failure writes the case, its schedule and its `AVRA_SCHED_SEED` replay
# line into the job summary. A PR that changes this file runs it once, so
# the workflow is proved before it lands.
name: orders

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/orders.yml]

concurrency:
  group: orders-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    # THE CHECKS' MACHINE, named once: every other job's `container` is this alias.
    container: &ci-image
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: plan
        run: |
          pkgs=$(sh tools/packages.sh) || exit 1
          echo "key=avrac-$(sh tools/compiler_paths.sh --key)" >> "$GITHUB_OUTPUT"
          echo "shards=$(printf '%s\n' "$pkgs" | python3 tools/shards.py 4)" >> "$GITHUB_OUTPUT"
      # The compiler main's own checks cached, or built as they build it.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: build/avra
          key: ${{ steps.plan.outputs.key }}
          restore-keys: |
            avrac-
      # A pull request's Rung: commits are its ladder (tools/rungs.sh), as on the checks.
      - if: steps.cache.outputs.cache-hit != 'true'
        name: compiler
        run: |
          rungs=""
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch -q --depth=200 origin main "${{ github.event.pull_request.head.sha }}" 2>/dev/null || :
            base=$(git merge-base origin/main "${{ github.event.pull_request.head.sha }}" 2>/dev/null || :)
            [ -z "$base" ] || rungs=$(sh tools/rungs.sh "$base" "${{ github.event.pull_request.head.sha }}" | tr '\n' ' ')
          fi
          make -s compiler RUNGS="$rungs" LADDER_BASE="${base:-}"
      - name: objects and libs
        run: |
          make -s -j"$(nproc)" -o avra objects libs || make -s -o avra objects libs
          sh tools/hand_down.sh pack
      - uses: actions/upload-artifact@v4
        with:
          name: avra-compiler
          path: build/avra
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: avra-build
          path: avra-build.tar.gz
          compression-level: 0
          retention-days: 1

  suites:
    needs: [prepare]
    runs-on: ubuntu-latest
    container: *ci-image
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/handed-down
      - name: eight orders
        env:
          AVRA_SCHED_RUNS: "8"
        run: |
          fail=0
          for p in ${{ join(matrix.shard, ' ') }}; do
            [ -d "packages/$p/src" ] || continue
            echo "::group::$p"
            t=$(date +%s)
            if build/avra test "packages/$p" > "suite-$p.log" 2>&1; then
              cat "suite-$p.log"
            else
              fail=1
              cat "suite-$p.log"
              echo "::error::suite $p failed under eight orders"
              {
                echo "### \`$p\` failed under eight orders"
                echo '```'
                grep -E '✗|failed under schedule|while running|every task is waiting|outlived the case|AVRA_SCHED_SEED=' "suite-$p.log" | head -40
                echo '```'
                echo "Replay one schedule: \`AVRA_SCHED_SEED=<k> build/avra test packages/$p\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
            echo "$p $(( $(date +%s) - t ))s"
          done
          exit $fail

  # THE LAYOUT SOLVER'S WIDE SWEEP: nine seeds of 300 random trees against
  # Firefox running the real html target (tools/layout_oracle.sh). A PR runs
  # one seed when it touches what the oracle reads; the night runs the rest.
  layout-sweep:
    needs: [prepare]
    runs-on: ubuntu-latest
    container: *ci-image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/handed-down
      - name: nine seeds
        env:
          LAYOUT_ORACLE_SEEDS: "1 2 3 4 5 6 7 8 9"
          LAYOUT_ORACLE_CASES: "300"
          CI: "true"
        run: sh tools/layout_oracle.sh

  # THE KEEPERS TOO LONG FOR EVERY PULL REQUEST, run each night: the mutation
  # fuzzer over the program tests, the UI diff's law over random trees, the HTTP
  # fuzzer and the saved-answer meter's two cold checks. Each target says so above its rule (`# keeper: nightly (orders)`).
  nightly-keepers:
    needs: [prepare]
    runs-on: ubuntu-latest
    container: *ci-image
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        keeper: ['fuzz', 'ui-fuzz', 'fuzz-http', 'leaves']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/handed-down
      - name: keeper
        timeout-minutes: 20
        run: make -s -o avra ${{ matrix.keeper }}

  # A NIGHTLY FAILURE IS NEVER SILENT: it opens the `nightly` issue, or adds the
  # run to the open one, naming every job that failed.
  report:
    needs: [suites, layout-sweep, nightly-keepers]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: open or ping the nightly issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(gh run view "${{ github.run_id }}" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          body="The nightly run failed: ${failed:-a job}. $RUN"
          n=$(gh issue list --state open --label nightly --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh label create nightly --color B60205 --description "the nightly orders run failed" 2>/dev/null || :
            gh issue create --title "nightly: the orders run failed" --label nightly --body "$body"
          fi
