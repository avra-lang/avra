# THE MAC'S COMPILER, published beside the gate's builder as `gate-builder`'s compiler-macos.tar.gz, packed as
# the gate's pack is (the binary, its hot leaves, its stamp and every object build/ keeps at its top).
# `tools/work compiler` lays it into the depot, where a Mac lane's pre-commit hook finds a stamped compiler.
#
# THE COMMITTED SEED IS OLDER THAN PROGRAM'S SOURCE and cannot build it, so the Mac starts from the TREE'S OWN
# SEED: a Linux job lays the tree's Linux compiler down (the release's pack where its source is the tree's,
# else generations 1 and 2 built from it) and emits the cli (`avra emit`, the IR `make seed` commits, which
# names no target); the Mac links it (`make recover`) and builds generations 1 and 2 from it, natively.
#
# EACH LANDING PUBLISHES ONE: a push to `program` (a landing, after its gate) builds the landed tree. A push
# to `compiler-macos/**` or a dispatch builds the tree the release's compiler was built from (its stamp's
# commit), or the dispatch's `ref`.
#
# PROVENANCE: the binary's stamp (build/.avra-built-from) must name the built tree's own compiler source,
# and it is published only where that source is the release's own compiler's — a landing waits (bounded)
# for its gate-builder upload; a build of another source stays an artifact.
name: compiler-macos

on:
  push:
    branches: [program, "compiler-macos/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: the commit to build (default — the gate-builder release's stamp)
        required: false
      start:
        description: a witness of the climb — the commit whose compiler starts it (built here from the release's), never published
        required: false

concurrency:
  group: compiler-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RELEASE_STAMP: https://github.com/avra-lang/avra/releases/download/gate-builder/compiler.tar.gz

jobs:
  seed:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.tree.outputs.commit }}
    env:
      LLVM_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      # THE TREE: a landing's own, else the one the release's stamp names
      - name: the tree
        id: tree
        env:
          REF: ${{ inputs.ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gb.tar.gz" "$RELEASE_STAMP"
          tar -xzOf "$RUNNER_TEMP/gb.tar.gz" build/.avra-built-from > "$RUNNER_TEMP/stamp"
          read -r hash at gen < "$RUNNER_TEMP/stamp"
          echo "compiler-macos: the gate-builder release — compiler source $hash, at $at, generation $gen"
          if [ "$GITHUB_REF" = refs/heads/program ]; then want=$GITHUB_SHA; else want=${REF:-$at}; fi
          [ "$want" != edited ] || { echo "::error::the release's stamp names no commit (edited)"; exit 1; }
          git fetch -q --depth=1 origin "$want"
          git checkout -q --detach FETCH_HEAD
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "compiler-macos: the tree is $(git rev-parse HEAD)"
      - name: the tree's Linux compiler
        timeout-minutes: 50
        env:
          START: ${{ inputs.start }}
        run: |
          if [ -n "$START" ]; then
            # THE CLIMB WITNESSED: the start's own source built once by the release's compiler reads what that
            # source reads, so the tree's rungs since it are a ladder the build must climb
            git fetch -q --unshallow origin 2>/dev/null || :
            tar -xzf "$RUNNER_TEMP/gb.tar.gz" build/avra
            git worktree add -q --detach "$RUNNER_TEMP/start" "$START"
            mkdir -p "$RUNNER_TEMP/start/build" && cp build/avra "$RUNNER_TEMP/start/build/avra"
            (cd "$RUNNER_TEMP/start" && make -s avra) || { echo "::error::the release's compiler did not build the start, $START"; exit 1; }
            cp "$RUNNER_TEMP/start/build/avra" build/avra
            echo "x $(git rev-parse "$START") 1" > "$RUNNER_TEMP/stamp"
            echo "compiler-macos: the climb starts from $START's own compiler"
          fi
          if [ -z "$START" ] && sh tools/gate.sh unpack "$RUNNER_TEMP/gb.tar.gz"; then
            echo "compiler-macos: the release's compiler is this tree's"
          else
            [ -n "$START" ] || tar -xzf "$RUNNER_TEMP/gb.tar.gz" build/avra
            # THE RUNGS BETWEEN THE RELEASE'S SOURCE AND THIS TREE (tools/rungs.sh), climbed as a gate climbs
            # them: a landing keeps its commits, so a rung it carries is in that history, and the release's
            # compiler cannot read the tree past one
            read -r _hash at _gen < "$RUNNER_TEMP/stamp"
            git fetch -q --unshallow origin 2>/dev/null || :
            rungs=
            if git merge-base --is-ancestor "$at" HEAD 2>/dev/null; then rungs=$(sh tools/rungs.sh "$at" HEAD | tr '\n' ' '); fi
            [ -z "$START" ] || [ -n "$rungs" ] || { echo "::error::the witness climbs no rung between $START and the tree — start below one"; exit 1; }
            echo "compiler-macos: generations 1 and 2 of this tree from the release's compiler, over $(echo $rungs | wc -w) rung(s) since $at: $rungs"
            make -s compiler RUNGS="$rungs" LADDER_BASE="$at" LADDER_BOUND=1800
          fi
          cat build/.avra-built-from
      - name: the tree's seed
        timeout-minutes: 20
        run: |
          export AVRA_CAP_MB=$(awk '/^MemTotal:/ { print int($2 / 1024) - 1200 }' /proc/meminfo)
          ./avra emit packages/cli > build/seed.ll
          echo "compiler-macos: the tree's seed, $(wc -l < build/seed.ll | tr -d ' ') lines"
          gzip -9 -n build/seed.ll
      - uses: actions/upload-artifact@v4
        with:
          name: tree-seed
          path: build/seed.ll.gz
          retention-days: 3
          if-no-files-found: error

  build:
    needs: [seed]
    # a witness of the climb ends at the tree's seed: the Mac's half reads that seed alone
    if: inputs.start == ''
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # the runner holds 7 GB and the cli's build outgrows it; macOS swaps, so the pool is sized past the RAM
      AVRA_MEM_POOL_MB: "16000"
      AVRA_CAP_MB: "16000"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: the tree
        run: |
          git fetch -q --depth=1 origin "${{ needs.seed.outputs.commit }}"
          git checkout -q --detach FETCH_HEAD
          echo "compiler-macos: building $(git rev-parse HEAD)"
      - uses: actions/download-artifact@v4
        with: { name: tree-seed, path: tree-seed }
      - name: toolchain
        run: |
          brew install llvm@22 zstd || brew install llvm zstd
          p=$(brew --prefix llvm@22 2>/dev/null || brew --prefix llvm)
          echo "LLVM_PREFIX=$p" >> "$GITHUB_ENV"
          "$p/bin/clang" --version | head -n 1
      # the tree's seed linked here, then generations 1 and 2 built from it: a Mac binary of this source alone
      - name: generations 1 and 2
        timeout-minutes: 100
        run: |
          mkdir -p build
          gzip -dc tree-seed/seed.ll.gz > build/seed.ll
          touch build/seed.ll
          make -s recover
          make -s avra
          make -s avra
          build/avra --version
          cat build/.avra-built-from
      - name: held to its tree
        id: held
        run: |
          read -r hash at gen < build/.avra-built-from
          tree=$(sh tools/work compiler-hash .)
          echo "compiler-macos: built from compiler source $hash at $at, generation $gen; the tree's is $tree"
          [ "$hash" = "$tree" ] || { echo "::error::the Mac's compiler says it was built from $hash, its tree's compiler source is $tree"; exit 1; }
          [ "$at" != edited ] || { echo "::error::the build says it was built from edited source"; exit 1; }
          [ "$gen" = 2 ] || echo "::warning::the Mac's compiler is generation $gen of its source, not 2"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      # THE MAC'S wisp, beside its compiler: `./wisp` built by this generation 2, keyed as the Linux one is (`./wisp
      # --key`, git's hash of packages/wisp), so a Mac lane fetches it by key and builds no compiler for its keepers
      - name: wisp
        id: wisp
        timeout-minutes: 15
        run: |
          key=$(./wisp --key)
          bin=$(./wisp --compiler build/avra --path)
          [ "$bin" = "build/wisp/$key/wisp" ] || { echo "::error::./wisp --path answered $bin, not build/wisp/$key/wisp"; exit 1; }
          file "$bin" | grep -q "Mach-O 64-bit executable arm64" || { echo "::error::$bin is no arm64 Mach-O: $(file "$bin")"; exit 1; }
          COPYFILE_DISABLE=1 tar -czf wisp-macos.tar.gz "$bin"
          echo "compiler-macos: wisp of key $key, $(du -k wisp-macos.tar.gz | cut -f1) KB"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: pack
        run: |
          { for f in build/avra build/avra_hot.bc build/avra_hot.inc build/.avra-built-from; do [ ! -f "$f" ] || echo "$f"; done
            find build -maxdepth 1 -type f \( -name '*.o' -o -name '*.a' -o -name '*.so' -o -name '*.sha' -o -name '*.d' \) | sort; } > "$RUNNER_TEMP/packed"
          COPYFILE_DISABLE=1 tar -czf compiler-macos.tar.gz -T "$RUNNER_TEMP/packed"
          gzip -t compiler-macos.tar.gz
          echo "compiler-macos: $(wc -l < "$RUNNER_TEMP/packed" | tr -d ' ') file(s), $(du -k compiler-macos.tar.gz | cut -f1) KB"
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-macos
          path: |
            compiler-macos.tar.gz
            wisp-macos.tar.gz
          retention-days: 7
      # BESIDE THE RELEASE'S OWN COMPILER ONLY: a landing's upload may come after this build, so the stamp is
      # asked again for up to 15 minutes; a dispatched ref of another source stays an artifact
      - name: publish
        if: inputs.ref == '' && inputs.start == ''
        run: |
          want=${{ steps.held.outputs.hash }}
          for i in $(seq 1 16); do
            have=$(curl -fsSL --retry 3 "$RELEASE_STAMP" | tar -xzOf - build/.avra-built-from | cut -d' ' -f1) || have=
            [ "$have" != "$want" ] || break
            [ "$i" = 16 ] && { echo "::error::the gate-builder release's compiler is of source ${have:-unread}, this one of $want — not published"; exit 1; }
            echo "compiler-macos: the release's compiler is of source ${have:-unread}, waiting for $want"
            sleep 60
          done
          gh release upload gate-builder compiler-macos.tar.gz wisp-macos.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          echo "compiler-macos: https://github.com/$GITHUB_REPOSITORY/releases/download/gate-builder/compiler-macos.tar.gz"
          echo "compiler-macos: https://github.com/$GITHUB_REPOSITORY/releases/download/gate-builder/wisp-macos.tar.gz (key ${{ steps.wisp.outputs.key }})"
