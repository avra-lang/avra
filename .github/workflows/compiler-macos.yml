# THE MAC'S COMPILER, published beside the gate's builder as `gate-builder`'s compiler-macos.tar.gz: a tree
# built on macOS arm64 — the seed's link, then generations 1 and 2 (`make compiler`) — packed as the gate's
# pack is (the binary, its hot leaves, its stamp and every object build/ keeps at its top). `tools/work
# compiler` lays it into the depot, where a Mac lane's pre-commit hook finds a stamped compiler.
#
# EACH LANDING PUBLISHES ONE: a push to `program` (a landing, after its gate) builds the landed tree. A push
# to `compiler-macos/**` or a dispatch builds the tree the release's compiler was built from (its stamp's
# commit), or the dispatch's `ref`.
#
# PROVENANCE: the binary's stamp (build/.avra-built-from) must name the built tree's own compiler source,
# and it is published only where that source is the release's own compiler's — a landing waits (bounded)
# for its gate-builder upload; a build of another source stays an artifact.
name: compiler-macos

on:
  push:
    branches: [program, "compiler-macos/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: the commit to build (default — the gate-builder release's stamp)
        required: false

concurrency:
  group: compiler-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # the runner holds 7 GB and the cli's build outgrows it; macOS swaps, so the pool is sized past the RAM
  AVRA_MEM_POOL_MB: "16000"
  RELEASE_STAMP: https://github.com/avra-lang/avra/releases/download/gate-builder/compiler.tar.gz

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      # THE TREE: a landing's own, else the one the release's stamp names
      - name: the tree
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/program ]; then
            want=$GITHUB_SHA
            echo "compiler-macos: the landed tree"
          else
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/gb.tar.gz" "$RELEASE_STAMP"
            read -r hash at gen < <(tar -xzOf "$RUNNER_TEMP/gb.tar.gz" build/.avra-built-from)
            echo "compiler-macos: the gate-builder release — compiler source $hash, at $at, generation $gen"
            want=${REF:-$at}
            [ "$want" != edited ] || { echo "::error::the release's stamp names no commit (edited)"; exit 1; }
          fi
          git fetch -q --depth=1 origin "$want"
          git checkout -q --detach FETCH_HEAD
          echo "compiler-macos: building $(git rev-parse HEAD)"
      - name: toolchain
        run: |
          brew install llvm@22 zstd || brew install llvm zstd
          p=$(brew --prefix llvm@22 2>/dev/null || brew --prefix llvm)
          echo "LLVM_PREFIX=$p" >> "$GITHUB_ENV"
          "$p/bin/clang" --version | head -n 1
      - name: generations 1 and 2
        timeout-minutes: 100
        run: |
          make -s compiler
          build/avra --version
          cat build/.avra-built-from
      - name: held to its tree
        id: held
        run: |
          read -r hash at gen < build/.avra-built-from
          tree=$(sh tools/work compiler-hash .)
          echo "compiler-macos: built from compiler source $hash at $at, generation $gen; the tree's is $tree"
          [ "$hash" = "$tree" ] || { echo "::error::the Mac's compiler says it was built from $hash, its tree's compiler source is $tree"; exit 1; }
          [ "$at" != edited ] || { echo "::error::the build says it was built from edited source"; exit 1; }
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: pack
        run: |
          { for f in build/avra build/avra_hot.bc build/avra_hot.inc build/.avra-built-from; do [ ! -f "$f" ] || echo "$f"; done
            find build -maxdepth 1 -type f \( -name '*.o' -o -name '*.a' -o -name '*.so' -o -name '*.sha' -o -name '*.d' \) | sort; } > "$RUNNER_TEMP/packed"
          COPYFILE_DISABLE=1 tar -czf compiler-macos.tar.gz -T "$RUNNER_TEMP/packed"
          gzip -t compiler-macos.tar.gz
          echo "compiler-macos: $(wc -l < "$RUNNER_TEMP/packed" | tr -d ' ') file(s), $(du -k compiler-macos.tar.gz | cut -f1) KB"
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-macos
          path: compiler-macos.tar.gz
          retention-days: 7
      # BESIDE THE RELEASE'S OWN COMPILER ONLY: a landing's upload may come after this build, so the stamp is
      # asked again for up to 15 minutes; a dispatched ref of another source stays an artifact
      - name: publish
        if: inputs.ref == ''
        run: |
          want=${{ steps.held.outputs.hash }}
          for i in $(seq 1 16); do
            have=$(curl -fsSL --retry 3 "$RELEASE_STAMP" | tar -xzOf - build/.avra-built-from | cut -d' ' -f1) || have=
            [ "$have" != "$want" ] || break
            [ "$i" = 16 ] && { echo "::error::the gate-builder release's compiler is of source ${have:-unread}, this one of $want — not published"; exit 1; }
            echo "compiler-macos: the release's compiler is of source ${have:-unread}, waiting for $want"
            sleep 60
          done
          gh release upload gate-builder compiler-macos.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          echo "compiler-macos: https://github.com/$GITHUB_REPOSITORY/releases/download/gate-builder/compiler-macos.tar.gz"
