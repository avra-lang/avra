# A GREEN PR ALWAYS HAS AUTO-MERGE ARMED, with nobody in the loop.
#
# A lane pushes a PR and moves on; if auto-merge is not set, a green PR
# sits unmerged until a human notices, which is the failure that cost a
# day. There is no merge queue: `main` requires the `test` check AND that
# a branch be up to date with it, so an armed PR merges itself once both
# hold, one at a time. This workflow arms auto-merge on every open,
# non-draft change, unless its title says DO NOT MERGE — a held title is a
# hold, and the watcher disarms one that is armed anyway.
#
# It is a second, independent path from the watcher (`pr-watcher.yml`):
# this one fires the instant a PR is opened or its head moves, the
# watcher sweeps on a five-minute cadence and after every `checks` run for
# anything either missed, including a PR that is behind `main`.
name: auto-merge

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened, labeled]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # A draft is a lane saying "not yet"; a fork's token cannot arm it.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A HOLD IS A TITLE OR THE `hold` LABEL, read FRESH from the PR: the event's own payload was
      # taken when the run was queued, and a lane that creates a PR and then labels it fired this
      # run first — a held batch PR was armed within seconds of its creation. A label added later
      # fires `labeled`, which lands here and disarms.
      - name: a held PR is a hold
        id: hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          title=$(gh pr view "$PR" -R "$REPO" --json title --jq .title)
          labels=$(gh pr view "$PR" -R "$REPO" --json labels --jq '[.labels[].name]|join(" ")')
          if printf '%s\n' "$title" | grep -qiE 'DO[[:space:]]+NOT[[:space:]]+MERGE'; then
            echo "auto-merge: the title says DO NOT MERGE — not arming it"
            echo "held=true" >> "$GITHUB_OUTPUT"
          elif printf ' %s ' "$labels" | grep -q ' hold '; then
            echo "auto-merge: #$PR carries the hold label — not arming it"
            echo "held=true" >> "$GITHUB_OUTPUT"
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
          fi
      - name: a held PR is disarmed
        if: steps.hold.outputs.held == 'true'
        env:
          GH_TOKEN: ${{ secrets.AVRA_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR" -R "$REPO" --disable-auto || echo "auto-merge: #$PR was not armed"
      - name: enable auto-merge
        if: steps.hold.outputs.held == 'false'
        env:
          # A PAT or app token is preferred: a merge by the repository's
          # GITHUB_TOKEN does not start the `push` workflows that publish
          # the compiler and refresh the speed baselines (GitHub starts no
          # workflow for an event its own token caused). The GITHUB_TOKEN
          # fallback still arms the merge; only those push runs are lost.
          GH_TOKEN: ${{ secrets.AVRA_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR" -R "$REPO" --auto --squash \
            && echo "auto-merge: #$PR — autoMerge=true (it merges when green and up to date)" \
            || { echo "::error::auto-merge: could not enable for #$PR — see the log above"; exit 1; }
