# THE MERGE QUEUE'S CHECK, SHARDED. A train used to be ONE serial job (~17
# minutes: build, keepers, gate, then every affected package's suite one after
# another). Now:
#   prepare  builds the compiler ONCE, computes the affected packages, splits
#            them into shards, and hands the binary down as an artifact.
#   suites   one matrix job PER SHARD, in parallel on their own runners.
#   keepers  the keepers (`make keepers`, the Makefile's one list), on the prepared compiler.
#   cache-attacks  the build cache's keeper, which clears the store it runs through.
#   gate     the changed-file fmt and the affected packages' idioms.
#   test     the ONE required check name: an aggregate that passes iff every
#            needed job succeeded or was skipped.
# A PR runs the same gate and sharded suites on its own tree, so it cannot
# enqueue untested; the train still runs the COMBINATION, where cross-PR
# interactions live. The shard count trades runner slots (the queue has ten)
# against wall time: four shards leaves room for two trains at once.
name: checks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      changed: ${{ steps.shards.outputs.changed }}
      packages: ${{ steps.shards.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 20 }
      - if: github.event_name != 'pull_request'
        id: key
        run: echo "key=avra-${{ hashFiles('Makefile', 'backend/**', 'runtime/**', 'bootstrap/**', 'packages/**', '!packages/**/tests/**') }}" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: build/avra
          key: ${{ steps.key.outputs.key }}
          restore-keys: avra-
      # A PR has no cached binary, so it BOOTSTRAPS from the committed seed.
      # A PR that ADDS SYNTAX cannot be bootstrapped by its base's seed (the
      # generation law) — those still land by the refresh-after rule on main;
      # every other PR proves itself here, before it can enqueue.
      - if: steps.cache.outputs.cache-hit != 'true'
        name: compiler
        run: if [ -x build/avra ] && make -s avra && make -s avra; then :; else make -s bootstrap; fi
      - if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/avra
          key: ${{ steps.key.outputs.key }}
      # A PR diffs against its base, `origin/main`; so does the train.
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        name: base
        run: git fetch -q --depth=20 origin main
      - id: shards
        name: shards
        run: |
          changed=""
          pkgs=""
          if [ "${{ github.event_name }}" = pull_request ] || [ "${{ github.event_name }}" = merge_group ]; then
            changed=$(git diff --name-only --diff-filter=d origin/main HEAD -- '*.av' | tr '\n' ' ')
            pkgs=$(sh tools/affected_packages.sh origin/main HEAD "$PWD" 2>/dev/null)
          fi
          {
            echo "changed=${changed}"
            echo "packages=$(echo $pkgs)"
            echo "shards<<EOF"
            printf '%s\n' "$pkgs" | python3 -c 'import json,sys; xs=[l.strip() for l in sys.stdin if l.strip()]; n=4; print(json.dumps([xs[i::n] for i in range(n)] if xs else [[]]))'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: avra-compiler
          path: build/avra
          retention-days: 1

  keepers:
    needs: [prepare]
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - run: chmod +x build/avra
      # ONE LIST, the Makefile's: `tools/gate_changed.sh` runs the same target.
      - name: keepers
        run: make -s -o avra keepers

  # THE BUILD CACHE, ATTACKED. Its own job: it clears the store it builds
  # through, and it runs beside the gate rather than after it.
  cache-attacks:
    needs: [prepare]
    if: github.event_name == 'merge_group' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - run: chmod +x build/avra
      - name: cache-attacks
        run: make -s -o avra cache-attacks

  gate:
    needs: [prepare]
    if: github.event_name == 'merge_group' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - run: chmod +x build/avra
      # A pull_request runs the keepers INSIDE the gate (it has no keepers job);
      # the train already ran them above, so it passes --no-keepers.
      - name: gate
        run: |
          extra=""
          if [ "${{ github.event_name }}" = merge_group ]; then extra=--no-keepers; fi
          sh tools/gate_changed.sh --files ${{ needs.prepare.outputs.changed }} --packages ${{ needs.prepare.outputs.packages }} $extra

  suites:
    needs: [prepare]
    if: github.event_name == 'merge_group' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - run: chmod +x build/avra
      - run: make -s -o avra objects libs
      - name: suites
        run: |
          fail=0
          for p in ${{ join(matrix.shard, ' ') }}; do
            [ -d "packages/$p/src" ] || continue
            echo "::group::$p"
            t=$(date +%s)
            build/avra test "packages/$p" || { fail=1; echo "::error::suite $p failed"; }
            echo "::endgroup::"
            echo "$p $(( $(date +%s) - t ))s"
          done
          exit $fail

  # THE ONE REQUIRED CHECK. Every other job is a shard or a step; this passes
  # iff each of them succeeded or was skipped (`always()` so it still reports
  # when a needed job failed, rather than being skipped itself).
  test:
    needs: [prepare, keepers, cache-attacks, gate, suites]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: verdict
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 -c "import json,sys; n=json.load(open('needs.json')); print(json.dumps(n, indent=2)); bad=[k for k,v in n.items() if v['result'] not in ('success','skipped')]; print('test: PASSED' if not bad else 'test: FAILED — '+', '.join(bad)); sys.exit(1 if bad else 0)"
