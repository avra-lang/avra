# The merge queue's check: ONE job per train, so ten trains test at once on
# the ten free workers. A PR's own run only admits it to the queue (its branch
# was tested by `work test`); on main, the job builds and caches the compiler
# every PR and train starts from. `test` is the one required check. A
# dispatched run builds and runs the static keepers alone. The
# machine is .github/ci/Dockerfile's image; a train is at most ten entries
# over main, so twenty commits of history reach it. A train is judged against
# main itself, never its `base_sha`, which is the train ahead of it: every
# PR the train carries is tested, so landing it lands only what was tested.
name: checks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    steps:
      - if: github.event_name == 'pull_request'
        run: echo "admitted; the train is what gets tested"
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with: { fetch-depth: 20 }
      - if: github.event_name != 'pull_request'
        id: key
        run: echo "key=avra-${{ hashFiles('Makefile', 'backend/**', 'runtime/**', 'bootstrap/**', 'packages/**', '!packages/**/tests/**') }}" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: build/avra
          key: ${{ steps.key.outputs.key }}
          restore-keys: avra-
      - if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        name: compiler
        run: if [ -x build/avra ] && make -s avra && make -s avra; then :; else make -s bootstrap; fi
      - if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/avra
          key: ${{ steps.key.outputs.key }}
      - if: github.event_name == 'merge_group'
        name: main
        run: git fetch -q --depth=20 origin main
      - if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        name: keepers
        run: |
          fail=0
          for k in fingerprints vocab cited externs dogfooding-rules; do
            echo "::group::$k"
            make -s -o avra "$k" || { fail=1; echo "::error::keeper $k refused"; }
            echo "::endgroup::"
          done
          exit $fail
      - if: github.event_name == 'merge_group'
        name: fmt
        run: |
          changed=$(git diff --name-only --diff-filter=d origin/main HEAD -- '*.av')
          [ -z "$changed" ] || build/avra fmt --check $changed
      - if: github.event_name == 'merge_group'
        name: idioms
        run: |
          fail=0
          for p in $(sh tools/affected_packages.sh origin/main HEAD "$PWD" 2>/dev/null); do
            [ -d "packages/$p/src" ] || continue
            build/avra check "packages/$p" --baseline tools/idioms.baseline || { fail=1; echo "::error::idioms $p"; }
          done
          exit $fail
      - if: github.event_name == 'merge_group'
        name: suites
        run: |
          pkgs=$(sh tools/affected_packages.sh origin/main HEAD "$PWD" 2>/dev/null)
          [ -z "$pkgs" ] || make -s -o avra objects libs
          fail=0
          for p in $pkgs; do
            echo "::group::$p"
            t=$(date +%s)
            build/avra test "packages/$p" || { fail=1; echo "::error::suite $p failed"; }
            echo "::endgroup::"
            echo "$p $(( $(date +%s) - t ))s"
          done
          exit $fail
