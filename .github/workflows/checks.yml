# The merge queue's check: each train's combined commit, built and tested.
# Runs on the same Ubuntu and LLVM as the Sprites.
name: checks

on:
  pull_request:
  merge_group:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 90
    env:
      LLVM_PREFIX: /usr/lib/llvm-22
    steps:
      - name: toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git make python3 rsync clang-22 llvm-22-dev
          ln -sf /usr/lib/llvm-22/bin/clang /usr/local/bin/clang
          ln -sf /usr/lib/llvm-22/bin/llvm-config /usr/local/bin/llvm-config
          mkdir -p /opt/homebrew/opt && ln -sfn /usr/lib/llvm-22 /opt/homebrew/opt/llvm
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: compiler key
        id: key
        run: |
          git config --global --add safe.directory "$PWD"
          echo "hash=$(sh tools/sources_hash.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: build/avra
          key: avra-${{ steps.key.outputs.hash }}
          restore-keys: avra-
      - name: compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ -x build/avra ] && make -s avra && make -s avra; then :; else make -s bootstrap; fi
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: build/avra
          key: avra-${{ steps.key.outputs.hash }}
      - name: test
        run: sh tools/work test
