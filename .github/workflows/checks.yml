# THE MERGE QUEUE'S CHECK, SHARDED. A train used to be ONE serial job (~17
# minutes: build, keepers, gate, then every affected package's suite one after
# another). Now:
#   prepare  decides what the run owes, takes or builds the compiler ONCE,
#            builds the C objects and package libraries ONCE, and hands both
#            down as artifacts.
#   suites   one matrix job PER SHARD, in parallel on their own runners.
#   keepers  the static keepers and the seed check, on the prepared compiler
#            — the train's.
#   gate     the changed-file fmt and the packages' idioms.
#   cache-attacks  the build cache attacked — the train's.
#   test     the ONE required check name: an aggregate that passes iff every
#            needed job succeeded or was skipped.
# A PR RUNS THE MINIMUM, THE TRAIN RUNS THE GATE. A PR's own check is fmt,
# idioms and suites over the packages it TOUCHES; the train runs the keepers,
# the cache attacks and every AFFECTED package (dependents included) on the
# COMBINATION, so nothing lands untested and a PR pays the whole gate once,
# not twice. A failure only the train sees drops the PR one train later.
# A run asked for by hand (`gh workflow run checks --ref <branch>`) is a
# train's over every package. The shards are packed by measured seconds
# (tools/shards.py), so the slowest is as short as the heaviest suite allows. The shard count
# trades runner slots (the queue has ten) against wall time: four shards
# leaves room for two trains at once.
name: checks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: "leave empty for a whole train; `keepers` runs the keepers job alone"
        default: ""

# The event is part of the group: a run asked for by hand on a ref never
# cancels that ref's own PR check or train.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      changed: ${{ steps.plan.outputs.changed }}
      packages: ${{ steps.plan.outputs.packages }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 20 }
      # A PR diffs against its base, `origin/main`; so does the train.
      - if: github.event_name != 'push'
        name: base
        run: git fetch -q --depth=20 origin main
      # WHAT THIS RUN OWES, decided before anything is built. A TRAIN owes the
      # whole gate over every affected package. A PR owes the minimum: the
      # packages it TOUCHES (their dependents are the train's), and no
      # compiler at all when it touches no `.av`, no package and no compiler
      # source.
      - id: plan
        name: plan
        run: |
          event="${{ github.event_name }}"
          changed=""
          pkgs=""
          compiler=1
          build=1
          if [ "$event" != push ] && [ -z "${{ inputs.only }}" ]; then
            changed=$(git diff --name-only --diff-filter=d origin/main HEAD -- '*.av' | tr '\n' ' ')
          fi
          if [ "$event" = merge_group ]; then
            pkgs=$(sh tools/affected_packages.sh origin/main HEAD "$PWD")
          fi
          # Asked for by hand, the run is a train's over EVERY package: the
          # whole gate on any branch, without a queue entry.
          if [ "$event" = workflow_dispatch ] && [ -z "${{ inputs.only }}" ]; then
            for d in packages/*/; do
              [ -d "${d}src" ] || { echo "::error::${d} has no src — a whole train would pass it by untested"; exit 1; }
            done
            pkgs=$(ls packages)
          fi
          if [ "$event" = pull_request ]; then
            pkgs=$(sh tools/affected_packages.sh --touched origin/main HEAD "$PWD")
            if git diff --quiet origin/main...HEAD -- $(sh tools/compiler_paths.sh) ':(exclude,glob)**/tests/**'; then compiler=0; fi
            if [ -z "$changed$pkgs" ] && [ "$compiler" = 0 ]; then build=0; fi
            # a file a PR keeper holds to the compiler wants one built to hold it to
            if ! git diff --quiet origin/main...HEAD -- docs/DIAGNOSTICS.md DOGFOODING.md Makefile 'tools/footprint*' tools/attack.sh; then build=1; fi
          fi
          key=$(sh tools/compiler_paths.sh --key)
          shards=$(printf '%s\n' "$pkgs" | python3 tools/shards.py 4)
          {
            echo "changed=${changed}"
            echo "packages=$(echo $pkgs)"
            echo "build=${build}"
            echo "key=avrac-${key}"
            echo "shards=${shards}"
          } >> "$GITHUB_OUTPUT"
          echo "plan: $event — build=$build compiler-changed=$compiler packages: $(echo $pkgs)"
      # THE KEEPERS THAT NEED NO COMPILER, on every PR and before anything is
      # built: a refusal one of them would speak stops here, in half a minute,
      # rather than on a train. The train runs every keeper regardless.
      - if: github.event_name == 'pull_request'
        name: static keepers
        run: make -s keepers-static
      # THE COMPILER IS KEYED BY ITS OWN SOURCE (tools/compiler_paths.sh), so a
      # tree whose compiler is main's takes main's binary and builds nothing.
      # Otherwise the newest cached binary only has to BUILD this tree — one
      # `make avra` advances one generation, so twice — and one too old to read
      # it (new syntax, a new refusal about its own source) fails that build
      # and the tree BOOTSTRAPS from the committed seed instead.
      - if: steps.plan.outputs.build == '1'
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: build/avra
          key: ${{ steps.plan.outputs.key }}
          restore-keys: |
            avrac-
            avra-
      - if: steps.plan.outputs.build == '1' && steps.cache.outputs.cache-hit != 'true'
        name: compiler
        run: if [ -x build/avra ] && make -s avra && make -s avra; then :; else make -s bootstrap; fi
      - if: steps.plan.outputs.build == '1' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/avra
          key: ${{ steps.plan.outputs.key }}
      - if: steps.plan.outputs.build == '1'
        uses: actions/upload-artifact@v4
        with:
          name: avra-compiler
          path: build/avra
          retention-days: 1
      # THE C OBJECTS AND PACKAGE LIBRARIES, built ONCE and handed down: every
      # job below runs programs, and each used to build these for itself.
      - if: steps.plan.outputs.build == '1' && github.event_name != 'push'
        name: objects and libs
        run: |
          make -s -j"$(nproc)" -o avra objects libs || make -s -o avra objects libs
          tar -cf avra-build.tar --exclude=build/avra build
      - if: steps.plan.outputs.build == '1' && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: avra-build
          path: avra-build.tar
          retention-days: 1

  keepers:
    needs: [prepare]
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - uses: actions/download-artifact@v4
        with: { name: avra-build }
      # Handed-down objects stand newer than this checkout's sources, so no
      # job rebuilds what prepare built from the same commit.
      - name: built
        run: tar -xf avra-build.tar && chmod +x build/avra && find build -type f -exec touch {} +
      # ONE LIST, the Makefile's. The keepers held to a clock run first, with
      # nothing beside them. Then its two halves run SIDE BY SIDE, each in its
      # own copy of the tree, so nothing one writes under build/ or beside a
      # package is the other's, and each takes its own build lock. Both run
      # to the end, and either refusing fails the job. Two, never three: a
      # third process on these four cores slowed every keeper and failed the
      # clocked ones.
      #
      # THE COMMITTED SEED STILL BUILDS THIS TREE, checked after the lighter
      # half: it links against the runtime and compiles HEAD. No other job
      # starts from the seed once a cached compiler exists, so a removed
      # runtime symbol the seed names, or source the seed cannot read, is
      # refused here before it can land.
      - name: keepers
        env:
          # the landing tool's supervisor checks need a machine with an init
          AVRA_NO_SUPERVISOR_TESTS: "1"
        run: |
          alone=0; a=0; b=0
          make -s -o avra keepers-alone || alone=1
          cp -a . ../keepers-b
          (cd ../keepers-b && export AVRA_BUILD_LOCK=/tmp/avra-build-b.lock && s=0 && { make -s -o avra keepers-b || s=1; } && { t0=$(date +%s); make -s -o avra seed-check || s=1; echo "keepers: seed-check $(( $(date +%s) - t0 ))s"; } && exit $s) > ../keepers-b.log 2>&1 &
          make -s -o avra keepers-a || a=1
          wait $! || b=1
          echo "::group::keepers-b and seed-check"; cat ../keepers-b.log; echo "::endgroup::"
          [ "$alone" = 0 ] || echo "::error::a keeper that runs alone refused"
          [ "$a" = 0 ] || echo "::error::a keeper in the first half refused"
          [ "$b" = 0 ] || echo "::error::a keeper in the second half, or the seed check, refused"
          exit $((alone + a + b))

  # THE BUILD CACHE, ATTACKED — the train's, like the keepers. Its own job: it
  # clears the store it builds through, and it runs beside the gate.
  cache-attacks:
    needs: [prepare]
    if: github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.only == '')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - uses: actions/download-artifact@v4
        with: { name: avra-build }
      # Handed-down objects stand newer than this checkout's sources, so no
      # job rebuilds what prepare built from the same commit.
      - name: built
        run: tar -xf avra-build.tar && chmod +x build/avra && find build -type f -exec touch {} +
      - name: cache-attacks
        run: make -s -o avra cache-attacks

  gate:
    needs: [prepare]
    if: github.event_name != 'push' && (needs.prepare.outputs.changed != '' || needs.prepare.outputs.packages != '')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - uses: actions/download-artifact@v4
        with: { name: avra-build }
      # Handed-down objects stand newer than this checkout's sources, so no
      # job rebuilds what prepare built from the same commit.
      - name: built
        run: tar -xf avra-build.tar && chmod +x build/avra && find build -type f -exec touch {} +
      # The keepers are the train's (its keepers job); a PR's gate is the
      # changed files' formatting and its touched packages' idioms.
      - name: gate
        run: sh tools/gate_changed.sh --files ${{ needs.prepare.outputs.changed }} --packages ${{ needs.prepare.outputs.packages }} --no-keepers

  # THE KEEPERS A PR CAN BREAK ALONE (`make keepers-pr`), under the compiler
  # the PR built: a refusal stops on the PR instead of failing a train. The
  # train runs every keeper in its keepers job.
  pr-keepers:
    needs: [prepare]
    if: github.event_name == 'pull_request' && needs.prepare.outputs.build == '1'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - uses: actions/download-artifact@v4
        with: { name: avra-build }
      - name: built
        run: tar -xf avra-build.tar && chmod +x build/avra && find build -type f -exec touch {} +
      - name: PR keepers
        run: make -s -o avra keepers-pr

  suites:
    needs: [prepare]
    if: github.event_name != 'push' && needs.prepare.outputs.packages != ''
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - uses: actions/download-artifact@v4
        with: { name: avra-build }
      # Handed-down objects stand newer than this checkout's sources, so no
      # job rebuilds what prepare built from the same commit.
      - name: built
        run: tar -xf avra-build.tar && chmod +x build/avra && find build -type f -exec touch {} +
      - name: suites
        run: |
          fail=0
          for p in ${{ join(matrix.shard, ' ') }}; do
            [ -d "packages/$p/src" ] || continue
            echo "::group::$p"
            t=$(date +%s)
            build/avra test "packages/$p" || { fail=1; echo "::error::suite $p failed"; }
            echo "::endgroup::"
            echo "$p $(( $(date +%s) - t ))s"
          done
          exit $fail

  # THE ONE REQUIRED CHECK. Every other job is a shard or a step; this passes
  # iff each of them succeeded or was skipped (`always()` so it still reports
  # when a needed job failed, rather than being skipped itself).
  test:
    needs: [prepare, keepers, cache-attacks, gate, suites]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A PART OF THE GATE IS NO VERDICT: a run asked for with `only` set posts
      # a failing `test`, so it can never stand as the required check on a
      # commit. Its jobs' own results say what it found.
      - if: github.event_name == 'workflow_dispatch' && inputs.only != ''
        name: partial
        run: |
          echo "test: NOT A VERDICT — this run was asked for with only=${{ inputs.only }}; read the jobs it ran"
          exit 1
      - name: verdict
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 -c "import json,sys; n=json.load(open('needs.json')); print(json.dumps(n, indent=2)); bad=[k for k,v in n.items() if v['result'] not in ('success','skipped')]; print('test: PASSED' if not bad else 'test: FAILED — '+', '.join(bad)); sys.exit(1 if bad else 0)"
