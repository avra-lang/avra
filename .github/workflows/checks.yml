# THE MERGE QUEUE'S CHECK, SHARDED. A train used to be ONE serial job (~17
# minutes: build, keepers, gate, then every affected package's suite one after
# another). Now:
#   prepare  decides what the run owes, takes or builds the compiler ONCE,
#            builds the C objects and package libraries ONCE, and hands both
#            down as artifacts.
#   suites   one matrix job PER SHARD, in parallel on their own runners.
#   keepers-a / keepers-b  the static keepers' two halves, EACH on its own
#            runner, the clocked ones running first alone.
#   seed-check  the committed seed builds this tree, ALONE on its own runner
#            — a compiler build beside the two halves was what the runner's
#            OOM killed (137), with nothing said.
#   gate     the changed-file fmt and the packages' idioms.
#   cache-attacks  the build cache attacked — on the train, on main's own
#                  push, and on a PR that reaches the store or the attacks.
#   test     the ONE required check name: an aggregate that passes iff every
#            needed job succeeded or was skipped.
# A PR RUNS THE MINIMUM, THE TRAIN RUNS THE GATE. A PR's own check is fmt on
# its touched files and `check` on the AFFECTED closure (touched plus every
# dependent) — no keepers, no suites, no object build — so a green PR is a
# fast floor that still catches a dependent's broken compile, not a second
# full gate. The train runs the keepers, the cache attacks, the seed check and
# the suites over that same affected set on the COMBINATION, so nothing lands
# untested. The watcher re-runs a PR's own failed jobs once.
# A run asked for by hand (`gh workflow run checks --ref <branch>`) is a
# train's over every package. The shards are packed by measured seconds
# (tools/shards.py), so the slowest is as short as the heaviest suite allows. The shard count
# trades runner slots (the queue has ten) against wall time: four shards
# leaves room for two trains at once.
name: checks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: "leave empty for a whole train; `keepers` runs the keepers and seed-check jobs alone"
        default: ""

# The event is part of the group: a run asked for by hand on a ref never
# cancels that ref's own PR check or train.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      changed: ${{ steps.plan.outputs.changed }}
      packages: ${{ steps.plan.outputs.packages }}
      build: ${{ steps.plan.outputs.build }}
      runtime: ${{ steps.plan.outputs.runtime }}
      cache: ${{ steps.plan.outputs.cache }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 20 }
      # A PR diffs against its base, `origin/main`; so does the train.
      - if: github.event_name != 'push'
        name: base
        run: git fetch -q --depth=20 origin main
      # WHAT THIS RUN OWES, decided before anything is built. Both a PR and a
      # train check the packages a diff AFFECTS — touched plus every package
      # that reaches one (tools/affected_packages.sh, the ONE definition) —
      # because a change in A that breaks a DEPENDENT B's compile must refuse
      # on the PR, not wait for a train (#484). A PR still owes no compiler at
      # all when it touches no `.av`, no package and no compiler source, and it
      # runs no suite: `check` is the floor, the train runs the programs.
      - id: plan
        name: plan
        run: |
          event="${{ github.event_name }}"
          changed=""
          pkgs=""
          compiler=1
          build=1
          runtime=0
          cache=0
          if [ "$event" != push ] && [ -z "${{ inputs.only }}" ]; then
            changed=$(git diff --name-only --diff-filter=d origin/main HEAD -- '*.av' | tr '\n' ' ')
          fi
          # A DIFF UNDER runtime/ OWES THE LATENCY GATE: the scheduler's
          # transition rows, which no suite catches (#490's tick cost a
          # getpid() a transition, silently). Held over every event, main's
          # own push included (against its parent), so the gate is the
          # runtime path's, not a PR's own invention.
          runtime_base=origin/main
          if [ "$event" = push ]; then runtime_base=HEAD~1; fi
          if git diff --name-only "$runtime_base" HEAD -- 'runtime/' | grep -q .; then runtime=1; fi
          # A PR AND A TRAIN OWE THE SAME CHECK SET: the affected closure. The
          # train adds the suites over it, never a package the PR skipped.
          if [ "$event" = merge_group ] || [ "$event" = pull_request ]; then
            pkgs=$(sh tools/affected_packages.sh origin/main HEAD "$PWD")
          fi
          # THE BUILD CACHE'S OWN ATTACKS RUN WHEREVER THE STORE CAN MOVE: the
          # train always, main's own push (so a store change main just took is
          # named on main, not only on a train), and a PR whose diff reaches the
          # store, the cache's key files or the attacks themselves. A store
          # rewrite once went PR-green because a PR skips these, and every train
          # after it failed until the queue stalled.
          if [ "$event" = merge_group ] || [ "$event" = push ]; then cache=1; fi
          if [ "$event" = workflow_dispatch ] && [ -z "${{ inputs.only }}" ]; then cache=1; fi
          if [ "$event" = pull_request ] && ! git diff --quiet origin/main...HEAD -- \
              packages/std-avrac/src/compiler/store \
              packages/std-avrac/src/compiler/build.av \
              packages/std-avrac/src/compiler/record.av \
              packages/std-avrac/src/compiler/answers.av \
              packages/std-avrac/src/compiler/host/input.av \
              packages/std-avrac/src/compiler/lower/code_hash.av \
              'tools/*attack*.sh'; then
            cache=1
          fi
          # Asked for by hand, the run is a train's over EVERY package: the
          # whole gate on any branch, without a queue entry.
          if [ "$event" = workflow_dispatch ] && [ -z "${{ inputs.only }}" ]; then
            for d in packages/*/; do
              [ -d "${d}src" ] || { echo "::error::${d} has no src — a whole train would pass it by untested"; exit 1; }
            done
            pkgs=$(ls packages)
          fi
          if [ "$event" = pull_request ]; then
            if git diff --quiet origin/main...HEAD -- $(sh tools/compiler_paths.sh) ':(exclude,glob)**/tests/**'; then compiler=0; fi
            if [ -z "$changed$pkgs" ] && [ "$compiler" = 0 ]; then build=0; fi
            # a file a PR keeper holds to the compiler wants one built to hold it to
            if ! git diff --quiet origin/main...HEAD -- docs/DIAGNOSTICS.md DOGFOODING.md Makefile 'tools/footprint*' tools/attack.sh; then build=1; fi
          fi
          # The attacks need a compiler and its objects: a run that owes them
          # owes the build, even when the diff itself is only the harness.
          if [ "$cache" = 1 ]; then build=1; fi
          key=$(sh tools/compiler_paths.sh --key)
          shards=$(printf '%s\n' "$pkgs" | python3 tools/shards.py 4)
          {
            echo "changed=${changed}"
            echo "packages=$(echo $pkgs)"
            echo "build=${build}"
            echo "runtime=${runtime}"
            echo "cache=${cache}"
            echo "key=avrac-${key}"
            echo "shards=${shards}"
          } >> "$GITHUB_OUTPUT"
          echo "plan: $event — build=$build compiler-changed=$compiler runtime=$runtime cache=$cache packages: $(echo $pkgs)"
      # THE COMPILER IS KEYED BY ITS OWN SOURCE (tools/compiler_paths.sh), so a
      # tree whose compiler is main's takes main's binary and builds nothing.
      # Otherwise the newest cached binary only has to BUILD this tree — one
      # `make avra` advances one generation, so twice — and one too old to read
      # it (new syntax, a new refusal about its own source) fails that build
      # and the tree BOOTSTRAPS from the committed seed instead.
      #
      # `.avra-cache` rides with the binary: a store is one compiler's, so the
      # restored binary reads its own store for the FIRST self-compile instead
      # of rebuilding every module (measured: the first compile 517s -> 404s,
      # the analysis and emit rows reused; `lower` is one program and still
      # re-runs). The SECOND self-compile is that new compiler's own first
      # build, so it is cold whatever this cache does.
      - if: steps.plan.outputs.build == '1'
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            build/avra
            .avra-cache
          key: ${{ steps.plan.outputs.key }}
          restore-keys: |
            avrac-
            avra-
      - if: steps.plan.outputs.build == '1' && steps.cache.outputs.cache-hit != 'true'
        name: compiler
        run: |
          s=$(date +%s)
          if [ -x build/avra ] && make -s avra && make -s avra; then :; else make -s bootstrap; fi
          echo "speed compiler $(( $(date +%s) - s ))" >> speed.log
      # A CACHE IS SCOPE-BOUND, AND ONLY THE DEFAULT BRANCH CROSSES RUNS: a run
      # restores caches from its own branch and `main`, never a sibling's, and
      # each merge-queue train stands on its own throwaway ref — so a compiler
      # saved by a train (or by a PR's merge ref) is unreachable to every other
      # train and only churns the store toward eviction. Save on `push` alone,
      # where the next train and every PR can restore it; `workflow_dispatch` may
      # write `main`'s scope too. Everything else restores only.
      - if: steps.plan.outputs.build == '1' && steps.cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: |
            build/avra
            .avra-cache
          key: ${{ steps.plan.outputs.key }}
      - if: steps.plan.outputs.build == '1'
        uses: actions/upload-artifact@v4
        with:
          name: avra-compiler
          path: build/avra
          retention-days: 1
      # THE C OBJECTS AND PACKAGE LIBRARIES, built ONCE and handed down to
      # the jobs that run programs — the keepers, the seed check, the suites,
      # and the cache attacks. A plain PR runs none of those (its check is fmt
      # and idioms on the packages it touched), so it pays no object build at
      # all; a PR that reaches the store runs the attacks and does.
      - if: steps.plan.outputs.build == '1' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.plan.outputs.cache == '1')
        name: objects and libs
        run: |
          make -s -j"$(nproc)" -o avra objects libs || make -s -o avra objects libs
          tar -cf avra-build.tar --exclude=build/avra build
      - if: steps.plan.outputs.build == '1' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.plan.outputs.cache == '1')
        uses: actions/upload-artifact@v4
        with:
          name: avra-build
          path: avra-build.tar
          retention-days: 1

      - name: speed baseline
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: speed-base.metrics
          key: speed-main-prepare-${{ github.sha }}
          restore-keys: speed-main-prepare-
      - if: always()
        name: speed note
        continue-on-error: true
        run: |
          sh tools/speed_note.sh collect speed.log > speed-now.metrics
          sh tools/speed_note.sh compare speed-now.metrics speed-base.metrics
      - if: always() && github.event_name == 'push' && hashFiles('speed-now.metrics') != ''
        name: speed baseline copy
        continue-on-error: true
        run: cp speed-now.metrics speed-base.metrics
      - if: always() && github.event_name == 'push' && hashFiles('speed-base.metrics') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: speed-base.metrics
          key: speed-main-prepare-${{ github.sha }}
  keepers-a:
    needs: [prepare]
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - uses: actions/download-artifact@v4
        with: { name: avra-build }
      # Handed-down objects stand newer than this checkout's sources, so no
      # job rebuilds what prepare built from the same commit.
      - name: built
        run: tar -xf avra-build.tar && chmod +x build/avra && find build -type f -exec touch {} +
      # WHAT THE RUNNER HAD: the cgroup's ceiling is the number a 137 is
      # measured against, and it is not the VM's published spec.
      - name: room
        run: |
          echo "room: cpu=$(nproc)"
          awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{printf "room: memory total %d MB, available %d MB\n", t/1024, a/1024}' /proc/meminfo
          printf 'room: cgroup memory.max %s B\n' "$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
      # THE RUNTIME KEEPERS HELD TO A CLOCK (KEEPERS_ALONE: runtime-tests,
      # runtime-mutations) ARE NOT THIS JOB'S: a runner that held them beside
      # this half was killed mid-mutation, and their own job is a follow-up.
      # The Makefile's `make keepers` still holds them.
      #
      # EACH HEAVY make PRINTS ITS PEAK (max RSS of the tree it waited on,
      # read from `getrusage`), so a runner grown past its memory is read
      # from the log rather than inferred from a 137.
      - name: keepers
        env:
          # the landing tool's supervisor checks need a machine with an init
          AVRA_NO_SUPERVISOR_TESTS: "1"
        run: |
          a=0
          # A CONTAINER STEP'S SHELL IS `sh`, WHICH HAS NO time BUILTIN and no
          # TIMEFORMAT — a first cut wrote `time ... %M` and every make was
          # skipped with "time: not found". The peak is read from the finished
          # tree's rusage, which needs nothing from the shell.
          peak() {
            peak_label="$1"; shift
            python3 -c 'import resource,subprocess,sys; rc=subprocess.call(sys.argv[2:]); print("%s: peak %d KB max RSS" % (sys.argv[1], resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss)); sys.exit(rc)' "$peak_label" "$@"
          }
          ta=$(date +%s)
          peak keepers-a make -s -o avra keepers-a || a=1
          echo "speed keepers-a $(( $(date +%s) - ta ))" >> speed.log
          [ "$a" = 0 ] || echo "::error::a keeper in the first half refused"
          exit "$a"

      - name: speed baseline
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: speed-base.metrics
          key: speed-main-keepers-${{ github.sha }}
          restore-keys: speed-main-keepers-
      - if: always()
        name: speed note
        continue-on-error: true
        run: |
          sh tools/speed_note.sh collect speed.log > speed-now.metrics
          sh tools/speed_note.sh compare speed-now.metrics speed-base.metrics
      - if: always() && github.event_name == 'push' && hashFiles('speed-now.metrics') != ''
        name: speed baseline copy
        continue-on-error: true
        run: cp speed-now.metrics speed-base.metrics
      - if: always() && github.event_name == 'push' && hashFiles('speed-base.metrics') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: speed-base.metrics
          key: speed-main-keepers-${{ github.sha }}
  # THE SECOND HALF, alone on its own runner. It needs only the lowercase
  # build artifact, and it shares the Makefile's one list with keepers-a —
  # never a second list kept in step by hand.
  keepers-b:
    needs: [prepare]
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - uses: actions/download-artifact@v4
        with: { name: avra-build }
      - name: built
        run: tar -xf avra-build.tar && chmod +x build/avra && find build -type f -exec touch {} +
      - name: keepers
        env:
          # the landing tool's supervisor checks need a machine with an init
          AVRA_NO_SUPERVISOR_TESTS: "1"
        run: |
          # A CONTAINER STEP'S SHELL IS `sh`, WHICH HAS NO time BUILTIN and no
          # TIMEFORMAT — a first cut wrote `time ... %M` and every make was
          # skipped with "time: not found". The peak is read from the finished
          # tree's rusage, which needs nothing from the shell.
          peak() {
            peak_label="$1"; shift
            python3 -c 'import resource,subprocess,sys; rc=subprocess.call(sys.argv[2:]); print("%s: peak %d KB max RSS" % (sys.argv[1], resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss)); sys.exit(rc)' "$peak_label" "$@"
          }
          peak keepers-b make -s -o avra keepers-b || exit 1
  # THE COMMITTED SEED STILL BUILDS THIS TREE — a compiler build, the
  # heaviest single keeper. It stands ALONE: run beside the two halves it was
  # the third compiler process on one runner, and the OOM killed the whole
  # keepers job (137) before anything could be said. No other job starts from
  # the seed once a cached compiler exists, so a removed runtime symbol the
  # seed names, or source the seed cannot read, is refused here before it can
  # land — and now a refusal is that job's, not the keepers'.
  seed-check:
    needs: [prepare]
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - uses: actions/download-artifact@v4
        with: { name: avra-build }
      # Handed-down objects stand newer than this checkout's sources, so make
      # rebuilds none of what prepare built from the same commit.
      - name: built
        run: tar -xf avra-build.tar && chmod +x build/avra && find build -type f -exec touch {} +
      - name: seed check
        run: |
          python3 -c 'import resource,subprocess,sys; rc=subprocess.call(sys.argv[1:]); print("seed-check: peak %d KB max RSS" % resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss); sys.exit(rc)' make -s -o avra seed-check
  # THE BUILD CACHE, ATTACKED. Its own job: it clears the store it builds
  # through, and it runs beside the gate. It runs on the train, on main's own
  # push, and on a PR that reaches the store or the attacks — the three places
  # the cache can move, so the attacks are named where the change is, not only
  # one train later.
  cache-attacks:
    needs: [prepare]
    if: needs.prepare.outputs.cache == '1'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - uses: actions/download-artifact@v4
        with: { name: avra-build }
      # Handed-down objects stand newer than this checkout's sources, so no
      # job rebuilds what prepare built from the same commit.
      - name: built
        run: tar -xf avra-build.tar && chmod +x build/avra && find build -type f -exec touch {} +
      - name: cache-attacks
        run: |
          s=$(date +%s)
          make -s -o avra cache-attacks
          echo "speed cache-attacks $(( $(date +%s) - s ))" >> speed.log
      - name: code-hash-attacks
        run: make -s -o avra code-hash-attacks

      - name: speed baseline
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: speed-base.metrics
          key: speed-main-cache-attacks-${{ github.sha }}
          restore-keys: speed-main-cache-attacks-
      - if: always()
        name: speed note
        continue-on-error: true
        run: |
          sh tools/speed_note.sh collect speed.log > speed-now.metrics
          sh tools/speed_note.sh compare speed-now.metrics speed-base.metrics
      - if: always() && github.event_name == 'push' && hashFiles('speed-now.metrics') != ''
        name: speed baseline copy
        continue-on-error: true
        run: cp speed-now.metrics speed-base.metrics
      - if: always() && github.event_name == 'push' && hashFiles('speed-base.metrics') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: speed-base.metrics
          key: speed-main-cache-attacks-${{ github.sha }}
  gate:
    needs: [prepare]
    if: github.event_name != 'push' && (needs.prepare.outputs.changed != '' || needs.prepare.outputs.packages != '')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      # A PR's gate reads the compiler alone: fmt on the changed files and
      # `check` on the affected packages. It does not untar the objects, does
      # not run the keepers, does not build the wasm target. The train is the
      # gate; the PR is the fast floor under it.
      - name: compiler
        run: chmod +x build/avra
      - name: gate
        run: |
          args="--files ${{ needs.prepare.outputs.changed }} --packages ${{ needs.prepare.outputs.packages }} --no-keepers"
          [ "${{ github.event_name }}" != pull_request ] || args="$args --pr-minimum"
          sh tools/gate_changed.sh $args

  # THE LATENCY GATE A RUNTIME CHANGE OWES: the scheduler's transition
  # rows against the recorded baseline, on the runner the checks' image
  # gives every job. A diff under runtime/ that costs a transition is
  # refused here, on the PR or on the train, before it can land silently.
  # Not a required check name of its own — `test` aggregates it — but it
  # fires only when runtime/ moved, so a compiler-only PR pays nothing.
  flow-gate:
    needs: [prepare]
    if: needs.prepare.outputs.runtime == '1'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: flow gate
        run: make -s flow-gate FLOW_GATE_ARGS=--require
  suites:
    needs: [prepare]
    # THE TRAIN'S, and a hand-run whole gate's. A PR's check does not run a
    # suite: the train runs every AFFECTED package (dependents included) on
    # the combination, which no single PR's tree can. A PR pays fmt + idioms.
    if: needs.prepare.outputs.packages != '' && (github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.only == ''))
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avra-compiler, path: build }
      - uses: actions/download-artifact@v4
        with: { name: avra-build }
      # Handed-down objects stand newer than this checkout's sources, so no
      # job rebuilds what prepare built from the same commit.
      - name: built
        run: tar -xf avra-build.tar && chmod +x build/avra && find build -type f -exec touch {} +
      - name: suites
        run: |
          fail=0
          for p in ${{ join(matrix.shard, ' ') }}; do
            [ -d "packages/$p/src" ] || continue
            echo "::group::$p"
            t=$(date +%s)
            build/avra test "packages/$p" || { fail=1; echo "::error::suite $p failed"; }
            echo "::endgroup::"
            echo "$p $(( $(date +%s) - t ))s" | tee -a speed.log
          done
          exit $fail

      - name: speed baseline
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: speed-base.metrics
          key: speed-main-suites-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: speed-main-suites-${{ strategy.job-index }}-
      - if: always()
        name: speed note
        continue-on-error: true
        run: |
          sh tools/speed_note.sh collect speed.log > speed-now.metrics
          sh tools/speed_note.sh compare speed-now.metrics speed-base.metrics
      - if: always() && github.event_name == 'push' && hashFiles('speed-now.metrics') != ''
        name: speed baseline copy
        continue-on-error: true
        run: cp speed-now.metrics speed-base.metrics
      - if: always() && github.event_name == 'push' && hashFiles('speed-base.metrics') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: speed-base.metrics
          key: speed-main-suites-${{ strategy.job-index }}-${{ github.sha }}
  # THE ONE REQUIRED CHECK. Every other job is a shard or a step; this passes
  # iff each of them succeeded or was skipped (`always()` so it still reports
  # when a needed job failed, rather than being skipped itself).
  test:
    needs: [prepare, keepers-a, keepers-b, seed-check, flow-gate, cache-attacks, gate, suites]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A PART OF THE GATE IS NO VERDICT: a run asked for with `only` set posts
      # a failing `test`, so it can never stand as the required check on a
      # commit. Its jobs' own results say what it found.
      - if: github.event_name == 'workflow_dispatch' && inputs.only != ''
        name: partial
        run: |
          echo "test: NOT A VERDICT — this run was asked for with only=${{ inputs.only }}; read the jobs it ran"
          exit 1
      - name: verdict
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 -c "import json,sys; n=json.load(open('needs.json')); print(json.dumps(n, indent=2)); bad=[k for k,v in n.items() if v['result'] not in ('success','skipped')]; print('test: PASSED' if not bad else 'test: FAILED — '+', '.join(bad)); sys.exit(1 if bad else 0)"
