# THE GATE ON A RUNNER: every slice `tools/gate.sh list` names, run from ONE seeded compiler, on a
# push to `gate/**`. The pushed branch is a one-commit mirror — the batch's tree over its parent, the
# trunk's — so the workflow is the pushed commit's own and nothing touches main; the idioms, fmt and
# keepers-alone slices take that parent (HEAD~1) as the base their diff starts at.
#
#   seed    `sh tools/gate.sh seed`: HEAD's compiler of generation 2, packed with its objects
#   census  `sh tools/gate.sh census`: the census compiler, built once by the seed's, beside the slices
#   slice   the runner jobs `tools/gate.sh jobs` deals, each slice alone in its tree, its words kept where
#           it fails
#   cost    the same of the cost slices, after the census, its compiler unpacked beside the seed's
#   verdict one table: slice, PASS or FAIL, seconds
name: gate

on:
  push:
    branches: ["gate/**"]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  actions: read

env:
  LLVM_PREFIX: /usr/lib/llvm-22
  # a runner holds 16 GB and runs one slice; the old path's whole-package checks pass 6 GB
  AVRA_MEM_CEILING_MB: "12000"

jobs:
  seed:
    runs-on: ubuntu-latest
    container: &gate-image
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      options: --cap-add=SYS_PTRACE
    timeout-minutes: 75
    outputs:
      slices: ${{ steps.slices.outputs.list }}
      jobs: ${{ steps.slices.outputs.jobs }}
      costs: ${{ steps.slices.outputs.costs }}
      browser: ${{ steps.slices.outputs.browser }}
      lays: ${{ steps.slices.outputs.lays }}
      frees: ${{ steps.slices.outputs.frees }}
      frees_laid: ${{ steps.slices.outputs.frees_laid }}
      sha8: ${{ steps.slices.outputs.sha8 }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # THE BUILDER IS ONE DEFINITION: the release `gate-builder`'s compiler, which landing replaces
      # with the gated compiler of the run that landed. A cache never carries it: a gate/<x> branch
      # restores only its own caches and the default branch's, never another gate's
      - name: builder
        run: |
          curl -fsSL --retry 3 -o gate-builder.tar.gz https://github.com/avra-lang/avra/releases/download/gate-builder/compiler.tar.gz
          # THE COMMON PATH: the release is the landed head's whole gate pack, and where this tree's
          # compiler source is that head's, the tree is seeded from it as it stands — its compiler of
          # generation 2 and its objects — and the seed builds no compiler. Where the source moved,
          # `unpack` refuses, and the release's compiler is the builder of this one.
          sh tools/gate.sh unpack gate-builder.tar.gz || tar xzf gate-builder.tar.gz build/avra
          build/avra --version
          # WHERE THE SOURCE MOVED, GENERATION 1 IS BUILT OVER THE BUILDER'S OWN STORES, kept beside it by
          # the landing (the landed gate's build slice packs them): a pack holding anything but the cli's
          # stores and a machine store is refused, and a miss builds as before
          if [ ! -f build/gate/.unpacked ] && curl -fsSL --retry 3 -o builder-store.tar.gz https://github.com/avra-lang/avra/releases/download/gate-builder/builder-store.tar.gz \
              && tar -tzf builder-store.tar.gz | awk '$0 !~ /^(packages\/cli\/(.*\/)?\.avra-cache|build\/gate\/[^\/]+\/machine)(\/|$)/ || $0 ~ /(^|\/)\.\.(\/|$)/ { bad = 1 } END { exit bad }'; then
            mkdir -p build/gate/builder-store && tar -xzf builder-store.tar.gz -C build/gate/builder-store && echo "builder stores: laid aside for generation 1"
          else
            echo "builder stores: none this seed reads — generation 1 builds cold"
          fi
      # THE RUNGS A TRAIN CLIMBS ARE KEPT FOR ITS NEXT GATE: each rung's product under its builder's bytes,
      # its tree and the toolchain (tools/ladder.sh), restored from this branch's last gate, and kept back
      # pruned to the rungs this run read or built. A gate's first climb builds; a re-gate takes them up.
      - uses: actions/cache/restore@v4
        with:
          path: ladder-cache
          key: ladder-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: ladder-${{ github.ref_name }}-
      - name: seed
        timeout-minutes: 70
        run: |
          mkdir -p ladder-cache && : > ladder-cache/.used
          sh tools/gate.sh seed --ladder-cache ladder-cache && exit 0
          find build/gate/pack -type f -exec sh -c 'echo "== $1"; tail -80 "$1"' _ {} \;
          exit 1
      - name: rungs kept
        if: always()
        run: |
          [ -s ladder-cache/.used ] || { echo "ladder: no rung climbed, none kept"; exit 0; }
          for d in ladder-cache/*/; do grep -qx "$(basename "$d")" ladder-cache/.used || find "$d" -delete; done
          echo "ladder: $(ls -d ladder-cache/*/ | wc -l) rung(s) kept for this branch's next gate"
      - if: always() && hashFiles('ladder-cache/*/avra') != ''
        uses: actions/cache/save@v4
        with:
          path: ladder-cache
          key: ladder-${{ github.ref_name }}-${{ github.run_id }}
      - name: slices
        id: slices
        run: |
          json() { python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))'; }
          echo "list=$(sh tools/gate.sh list | awk '{ print $1 }' | json)" >> "$GITHUB_OUTPUT"
          # THE RUNNER JOBS, dealt by measured seconds (tools/gate.sh jobs); a cost slice is a job alone, run
          # after the census
          echo "jobs=$(sh tools/gate.sh jobs | awk '$1 !~ /^cost-/ { print $1 }' | json)" >> "$GITHUB_OUTPUT"
          # THE SLICES THAT LAY THE SNAPSHOT'S STD ANSWERS wait for the one slice that makes them (cost-answers)
          echo "costs=$(sh tools/gate.sh jobs | awk '$1 ~ /^cost-/ && $1 !~ /^cost-answers/ && $1 !~ /laid/ && $1 !~ /^cost-matrix-/ { print $1 }' | json)" >> "$GITHUB_OUTPUT"
          echo "lays=$(sh tools/gate.sh jobs | awk '$1 ~ /^cost-/ && $1 ~ /laid/ && $1 !~ /^cost-matrix-/ { print $1 }' | json)" >> "$GITHUB_OUTPUT"
          # THE MATRIX RUNS UNCOUNTED, by the seed's compiler of generation 2 (cost.sh --uncounted): it waits for no
          # census, and its laid parts for generation 2's own answers (cost-answers-gen2)
          echo "frees=$(sh tools/gate.sh jobs | awk '$1 ~ /^cost-matrix-/ && $1 !~ /laid/ { print $1 }' | json)" >> "$GITHUB_OUTPUT"
          echo "frees_laid=$(sh tools/gate.sh jobs | awk '$1 ~ /^cost-matrix-/ && $1 ~ /laid/ { print $1 }' | json)" >> "$GITHUB_OUTPUT"
          # THE JOBS THAT CARRY THE BROWSER LEG (a keeper of KEEPERS_B, KEEPERS_WASM or the tool witnesses), which
          # run on the browser leg's machine
          echo "browser=$(sh tools/gate.sh jobs | { grep -E ' keepers-(b|wasm|tw)' || :; } | awk '{ print $1 }' | json)" >> "$GITHUB_OUTPUT"
          sh tools/gate.sh jobs | sed 's/^/gate: job /'
          echo "sha8=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: gate-pack
          path: build/gate/compiler-*.tar.gz
          retention-days: 3
          if-no-files-found: error

  # THE CENSUS COMPILER IS ITS OWN JOB, BESIDE THE SLICES: it took 257 s on train21 (45520921593), and in
  # the seed every slice waited for it; jobs dealt by seconds leave the cost jobs a runner when it ends
  census:
    needs: [seed]
    runs-on: ubuntu-latest
    container: *gate-image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with: { name: gate-pack, path: pack }
      - name: unpack
        run: sh tools/gate.sh unpack pack/compiler-${{ needs.seed.outputs.sha8 }}.tar.gz
      - name: census
        timeout-minutes: 16
        run: |
          sh tools/gate.sh census && exit 0
          find build/gate/census -type f -exec sh -c 'echo "== $1"; tail -80 "$1"' _ {} \;
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: gate-census
          path: build/gate/census-*.tar.gz
          retention-days: 3
          if-no-files-found: error

  slice:
    needs: [seed]
    runs-on: ubuntu-latest
    # A JOB THAT CARRIES THE BROWSER LEG RUNS ON avra-ci:llvm22-browser, WebKit's host libraries installed when
    # the image was built (.github/ci/Dockerfile.browser); a mirror mid-update cannot fail it
    container:
      image: ${{ contains(fromJSON(needs.seed.outputs.browser), matrix.slice) && 'ghcr.io/avra-lang/avra-ci:llvm22-browser' || 'ghcr.io/avra-lang/avra-ci:llvm22' }}
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      options: --cap-add=SYS_PTRACE
    # a slice's wall budget is tools/gate.sh's own (900 s, an edit-f or edit-g part 1500 s, its verdict OVER, the slice named); the
    # runner's bound stands just past it, so the gate names the slice before the runner kills the job —
    # a job of several slices past the budget of all of them
    timeout-minutes: ${{ startsWith(matrix.slice, 'jobs-') && 75 || (startsWith(matrix.slice, 'edit-f-') || startsWith(matrix.slice, 'edit-g-') || matrix.slice == 'keepers-heavy-1') && 32 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.seed.outputs.jobs) }}
    steps: &slice-steps
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with: { name: gate-pack, path: pack }
      - name: unpack
        run: sh tools/gate.sh unpack pack/compiler-${{ needs.seed.outputs.sha8 }}.tar.gz
      # A COST SLICE COUNTS WITH THE SEED'S CENSUS COMPILER, held to this tree's source as one built here is;
      # the matrix and generation 2's answers count nothing and run the seed's own
      - if: startsWith(matrix.slice, 'cost-') && !startsWith(matrix.slice, 'cost-matrix-') && matrix.slice != 'cost-answers-gen2'
        uses: actions/download-artifact@v4
        with: { name: gate-census, path: census }
      - name: census compiler
        if: startsWith(matrix.slice, 'cost-') && !startsWith(matrix.slice, 'cost-matrix-') && matrix.slice != 'cost-answers-gen2'
        run: tar -xzf census/census-${{ needs.seed.outputs.sha8 }}.tar.gz
      # THE BROWSER LEG'S MACHINE, for a job holding a keeper of KEEPERS_B or KEEPERS_WASM, as checks.yml's
      # keepers-b job carries it: the browser's host libraries, the pinned Node, Playwright's WebKit (its
      # cache is main's, which every branch reads) and gdb, which the defects keeper dumps a stall with
      - name: browser leg wanted
        id: browser
        run: |
          if sh tools/gate.sh jobs | awk -v j="${{ matrix.slice }}" '$1 == j' | grep -qE ' keepers-(b|wasm|tw)'; then echo "wanted=1" >> "$GITHUB_OUTPUT"; fi
          v=$(sed -n 's/^playwright_version=//p' tools/ui-board/playwright.sh)
          echo "playwright=$v" >> "$GITHUB_OUTPUT"
      - if: steps.browser.outputs.wanted == '1'
        name: browser libraries
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sh .github/ci/install_browser_libs.sh gdb
          sh .github/ci/install_node.sh
      - if: steps.browser.outputs.wanted == '1'
        uses: actions/cache/restore@v4
        with:
          path: build/playwright
          key: playwright-${{ steps.browser.outputs.playwright }}-webkit-browsers
      # THE SNAPSHOT'S STD ANSWERS, MADE ONCE A GATE (cost-answers; tools/cost.sh `laid`) from those KEPT
      # BESIDE THE BUILDER: the release
      # `gate-builder` carries the landed run's answers, which every gate can read (a cache cannot cross
      # gate/** branches). Laid down, they are judged by the writer's own key — the census compiler's
      # bytes, the snapshot's std — and written again where it is not theirs.
      - name: cost answers
        if: matrix.slice == 'cost-answers'
        run: |
          if curl -fsSL --retry 3 -o cost-answers.tar.gz https://github.com/avra-lang/avra/releases/download/gate-builder/cost-answers.tar.gz \
              && tar -tzf cost-answers.tar.gz | awk '$0 !~ /^cost-answers(\/|$)/ { bad = 1 } END { exit bad }'; then
            mkdir -p build && tar -xzf cost-answers.tar.gz -C build && echo "cost answers: the release's, laid down"
          else
            echo "cost answers: the release holds none this gate can read — the slice writes them"
          fi
      # A SLICE THAT LAYS THEM LAYS THIS GATE'S: the writer's key is every one of them theirs, so none is written again
      - if: contains(matrix.slice, 'laid') && !startsWith(matrix.slice, 'cost-matrix-')
        uses: actions/download-artifact@v4
        with: { name: gate-cost-answers, path: answers }
      - if: contains(matrix.slice, 'laid') && !startsWith(matrix.slice, 'cost-matrix-')
        name: this gate's answers
        run: |
          mkdir -p build && tar -xzf answers/cost-answers.tar.gz -C build && echo "cost answers: this gate's, laid down"
      - if: contains(matrix.slice, 'laid') && startsWith(matrix.slice, 'cost-matrix-')
        uses: actions/download-artifact@v4
        with: { name: gate-cost-answers-gen2, path: answers }
      - if: contains(matrix.slice, 'laid') && startsWith(matrix.slice, 'cost-matrix-')
        name: this gate's answers of generation 2
        run: |
          mkdir -p build && tar -xzf answers/cost-answers-gen2.tar.gz -C build && echo "cost answers: this gate's, of generation 2, laid down"
      # EACH SLICE OF A JOB RUNS ALONE, IN A TREE OF ITS OWN: the tree as unpacked is kept aside, and laid
      # down afresh before every slice after the first. Verdicts and a failing slice's words are kept in
      # gate-kept/, which no slice's tree holds.
      - name: ${{ matrix.slice }}
        timeout-minutes: ${{ startsWith(matrix.slice, 'jobs-') && 72 || (startsWith(matrix.slice, 'edit-f-') || startsWith(matrix.slice, 'edit-g-') || matrix.slice == 'keepers-heavy-1') && 28 || 16 }}
        run: |
          members=$(sh tools/gate.sh jobs | awk -v j="${{ matrix.slice }}" '$1 == j { $1 = ""; print }')
          [ -n "$members" ] || { echo "gate: tools/gate.sh jobs names no job ${{ matrix.slice }}"; exit 1; }
          pristine="$RUNNER_TEMP/gate-pristine"
          set -- $members
          [ "$#" = 1 ] || cp -a . "$pristine"
          mkdir -p gate-kept/verdict gate-kept/failed
          first=1
          st=0
          for s in $members; do
            if [ "$first" = 0 ]; then
              find . -mindepth 1 -maxdepth 1 ! -name gate-kept -exec find {} -delete \;
              cp -a "$pristine/." .
              echo "gate: the tree laid down afresh for $s"
            fi
            first=0
            case "$s" in idioms*|fmt|keepers-alone-*) base=$(git rev-parse HEAD~1) ;; *) base="" ;; esac
            one=0
            sh tools/gate.sh "$s" $base > gate.out 2>&1 || one=$?
            cat gate.out
            line=$(grep '^GATE ' gate.out | tail -1)
            [ -n "$line" ] || line="GATE $s ${{ needs.seed.outputs.sha8 }} FAIL rows=0 failed=0 0s (no GATE line, exit $one)"
            echo "$line" > "gate-kept/verdict/$s"
            echo "$line"
            # THE PASS LEDGER TRAVELS WITH THE VERDICT: its rows exactly as the run measured them, and its
            # tables as markdown a landing posts
            # A COST SLICE KEEPS WHAT IT MEASURED, passing or not: its `cost:` words and its rows as
            # the record under cost/ writes them, so an accept cites a run's own numbers
            case "$s" in cost-*)
                cat build/gate/"$s"/cost-*.log 2> /dev/null | grep '^cost: ' > "gate-kept/verdict/$s.cost" || :
                [ ! -f build/cost/snapshot ] || ./wisp cost rows build/cost > "gate-kept/verdict/$s.rows" || : ;;
            esac
            case "$s" in cost-ledger-* | cost-matrix-*) [ ! -f build/cost/ledger.md ] || cp build/cost/ledger.md "gate-kept/verdict/$s.md" ;; esac
            # A KEYED KEEPER KEEPS ITS LEDGER ROWS, passing or not (build/ledger/<name>/rows: footprint, the wasm
            # sizes), so a key the ledger holds no row of is seeded from a run's own numbers
            for r in build/ledger/*/rows; do [ ! -f "$r" ] || cp "$r" "gate-kept/verdict/$s.$(basename "$(dirname "$r")").rows"; done
            # A RUNG TRAIN'S SEED, emitted by its own compiler where seed-check stood down: the next train commits it
            for f in seed.ll.gz seed.sources; do [ ! -f "build/gate/$s/$f" ] || cp "build/gate/$s/$f" "gate-kept/verdict/$f"; done
            if [ "$one" != 0 ]; then
              st=1
              [ ! -d "build/gate/$s" ] || cp -a "build/gate/$s" "gate-kept/failed/$s"
            fi
          done
          exit "$st"
      # THE BUILDER'S STORES THIS RUN LEAVES, for a landing to publish beside the builder as builder-store.tar.gz
      - if: success() && matrix.slice == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: gate-builder-store
          path: build/gate/builder-store.tar.gz
          retention-days: 7
          if-no-files-found: ignore
      # THE ANSWERS THIS RUN STANDS ON, for a landing to publish beside the builder as cost-answers.tar.gz
      - if: success() && matrix.slice == 'cost-answers'
        run: tar -czf cost-answers.tar.gz -C build cost-answers
      - if: success() && matrix.slice == 'cost-answers'
        uses: actions/upload-artifact@v4
        with:
          name: gate-cost-answers
          path: cost-answers.tar.gz
          retention-days: 7
          if-no-files-found: ignore
      - if: success() && matrix.slice == 'cost-answers-gen2'
        run: tar -czf cost-answers-gen2.tar.gz -C build cost-answers-gen2
      - if: success() && matrix.slice == 'cost-answers-gen2'
        uses: actions/upload-artifact@v4
        with:
          name: gate-cost-answers-gen2
          path: cost-answers-gen2.tar.gz
          retention-days: 3
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-verdict-${{ matrix.slice }}
          path: gate-kept/verdict/
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.slice }}
          path: gate-kept/failed/
          retention-days: 7
          if-no-files-found: ignore

  cost:
    needs: [seed, census]
    runs-on: ubuntu-latest
    container: *gate-image
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.seed.outputs.costs) }}
    steps: *slice-steps

  # THE SNAPSHOT'S STD ANSWERS, once: every slice that lays them starts from this one's
  answers:
    needs: [seed, census]
    runs-on: ubuntu-latest
    container: *gate-image
    timeout-minutes: 20
    strategy:
      matrix:
        slice: [cost-answers]
    steps: *slice-steps

  # THE MATRIX, UNCOUNTED: after the seed alone, beside the census (cost.sh --uncounted)
  cost-free:
    needs: [seed]
    runs-on: ubuntu-latest
    container: *gate-image
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.seed.outputs.frees) }}
    steps: *slice-steps

  answers-gen2:
    needs: [seed]
    runs-on: ubuntu-latest
    container: *gate-image
    timeout-minutes: 20
    strategy:
      matrix:
        slice: [cost-answers-gen2]
    steps: *slice-steps

  cost-free-laid:
    needs: [seed, answers-gen2]
    runs-on: ubuntu-latest
    container: *gate-image
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.seed.outputs.frees_laid) }}
    steps: *slice-steps

  cost-laid:
    needs: [seed, census, answers]
    runs-on: ubuntu-latest
    container: *gate-image
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.seed.outputs.lays) }}
    steps: *slice-steps

  verdict:
    needs: [seed, census, slice, cost, answers, cost-laid, cost-free, answers-gen2, cost-free-laid]
    if: always()
    runs-on: ubuntu-latest
    container: *gate-image
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: gate-verdict-*, path: verdicts, merge-multiple: true }
      - name: table
        run: |
          [ "${{ needs.seed.result }}" = success ] || { echo "gate: the seed did not build — ${{ needs.seed.result }}"; exit 1; }
          [ "${{ needs.census.result }}" = success ] || echo "gate: the census compiler did not build — ${{ needs.census.result }}; every cost slice fails"
          [ "${{ needs.answers.result }}" = success ] || echo "gate: the snapshot's std answers were not made — ${{ needs.answers.result }}; every slice that lays them fails"
          printf '%-14s %-5s %s\n' slice verdict seconds
          failed=0
          for s in $(echo '${{ needs.seed.outputs.slices }}' | tr -d '[]",' ); do
            line=$(cat "verdicts/$s" 2>/dev/null || echo "GATE $s - FAIL rows=0 failed=0 0s (no verdict)")
            verdict=$(echo "$line" | awk '{ print $4 }')
            secs=$(echo "$line" | awk '{ print $7 }')
            printf '%-14s %-5s %s\n' "$s" "$verdict" "$secs"
            [ "$verdict" = PASS ] || failed=$((failed + 1))
          done
          echo "gate: ${{ needs.seed.outputs.sha8 }} — $failed slice(s) failed"
          [ "$failed" = 0 ]
      # THE GATE'S OWN WALL: every job's clock, their sum and the makespan the owner's target is about
      # (tools/ci_wall.sh), told against the ledger's `wall:ci-gate:` rows — a shared runner's clock is a
      # fact, never a verdict, so it warns and refuses nothing. The ledger's reader comes from the pack.
      - if: always() && needs.seed.result == 'success'
        uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - if: always() && needs.seed.result == 'success'
        uses: actions/download-artifact@v4
        with: { name: gate-pack, path: pack }
      - if: always() && needs.seed.result == 'success'
        name: wall
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh tools/gate.sh unpack pack/compiler-${{ needs.seed.outputs.sha8 }}.tar.gz > /dev/null
          if WALL_HOST=ci-gate sh tools/ci_wall.sh collect > wall.metrics; then
            sh tools/ledger_rows.sh wall.metrics wall clock tell
          else
            echo "::notice title=gate wall::the run's job clocks could not be read — not told"
          fi
      # THE GATE'S WALL IS JUDGED: its makespan against the record's target for its class, a train whose
      # compiler source moved `compiler` and any other `plain`, each rung it climbs priced at 300 s apart
      # (cost/gate/ci-gate.cost). A train past its target fails, unless an `over` line names the row.
      # A WALL NOT READ IS SAID, beside the judged rows: the API not answering once is GitHub's, so it is
      # unjudged and recorded (`gate wall unread`, which `tools/ci_wall.sh landed` reads back); a train
      # whose wall and program's landing's wall are both unread fails, so no regression stands behind it.
      - if: always() && needs.seed.result == 'success'
        id: wall_judged
        name: gate wall
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q --unshallow origin 2>/dev/null || :
          git fetch -q origin program:refs/remotes/origin/program
          if [ ! -s wall.metrics ]; then
            echo "unread=1" >> "$GITHUB_OUTPUT"
            landing=$(git rev-parse origin/program)
            { echo "#### gate wall"; echo "\`gate:ci-gate:gate makespan\` — UNREAD: the jobs API did not answer, so this run's wall is not judged"; } >> "$GITHUB_STEP_SUMMARY"
            if ! last=$(sh tools/ci_wall.sh landed "$landing"); then
              echo "::warning title=gate wall::the run's makespan was not read, and the wall record of program's landing (${landing}) could not be read either — unjudged"
              exit 0
            fi
            echo "program's landing (${landing}): its wall ${last}" >> "$GITHUB_STEP_SUMMARY"
            [ "$last" != unread ] || { echo "::error title=gate wall::the run's makespan was not read, and program's landing (${landing}) was unread too — two walls in a row unjudged"; exit 1; }
            echo "::warning title=gate wall::the run's makespan was not read (the jobs API did not answer), so its wall is not judged this run; program's landing's was ${last}"
            exit 0
          fi
          base=$(git merge-base origin/program HEAD)
          rungs=$(sh tools/rungs.sh "$base" HEAD | grep -c . || :)
          class=plain
          git diff --quiet "$base" HEAD -- $(sh tools/compiler_paths.sh) || class=compiler
          ms=$(awk '$1 == "wall" && $2 == "makespan" { print $3 }' wall.metrics)
          [ -n "$ms" ] || { echo "::error title=gate wall::the run's metrics hold no makespan"; exit 1; }
          net=$((ms - rungs * 300000))
          [ "$net" -ge 0 ] || net=0
          printf 'host ci-gate\ngate makespan_%s %s\n' "$class" "$net" > gate.metrics
          said="a ${class} train, makespan $((ms / 1000)) s, ${rungs} rung(s) at 300 s each, judged at $((net / 1000)) s"
          echo "gate wall: $said"
          { echo "#### gate wall"; echo "\`gate:ci-gate:gate makespan_${class}\` — $said"; } >> "$GITHUB_STEP_SUMMARY"
          sh tools/ledger_rows.sh gate.metrics gate clock judge
      # THE RECORD OF AN UNREAD WALL: a step that runs only then, so a later train reads it from the jobs
      - if: always() && steps.wall_judged.outputs.unread == '1'
        name: gate wall unread
        run: |
          echo "gate wall: this run's makespan was not read — recorded unread"
