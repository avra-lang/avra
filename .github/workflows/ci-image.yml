# Builds the checks' machine image whenever main's recipe changes.
name: ci-image

on:
  push:
    branches: [main]
    paths: [.github/ci/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .github/ci
          push: true
          tags: ghcr.io/avra-lang/avra-ci:llvm22
