# A LANE'S RUN (`sh tools/work run <cmd>`): one command over a lane's worktree as it stands, on a
# GitHub runner. The client snapshots the worktree, uncommitted files included, as one commit on
# `run/<lane>` and pushes it. The push is the order: the commit's message names the command and its
# bound. The compiler comes from the same action checks.yml's prepare uses (.github/actions/compiler).
# The job's status is the command's, and its exact code is the log's `lane-run: status <n>` line.
#
# ONE REF PER LANE keeps the lane warm: a cache is scoped to its ref, so `run/<lane>` restores what
# its last run saved (the compiler and its store) and main's own compiler caches beside it.
name: lane-run

on:
  push:
    branches: ["run/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: the commit to run over
        required: true
      cmd:
        description: the command, as a shell line
        required: true
      minutes:
        description: the command's bound
        default: "15"

concurrency:
  group: lane-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  # a lane keeps one save: the one before is deleted once the new one stands
  actions: write

env:
  # A job saves, restores and uploads stores between steps, so each build saves its own before it answers.
  AVRA_STORE_KEPT_HERE: "1"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      options: --cap-add=SYS_PTRACE
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 20
      # THE ORDER: the snapshot's message (`lane: `, `minutes: `, `builder: <key>`, `cmd-b64: `), or the dispatch's inputs.
      - id: order
        name: order
        env:
          CMD: ${{ inputs.cmd }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          git config --global --add safe.directory "$PWD"
          msg=$(git log -1 --format=%B)
          field() { printf '%s\n' "$msg" | sed -n "s/^$1: //p" | head -n 1; }
          if [ -n "$CMD" ]; then cmd=$CMD; minutes=${MINUTES:-15}; lane=dispatch; builder=; else
            cmd=$(field cmd-b64 | base64 -d); minutes=$(field minutes); lane=$(field lane); builder=$(field builder)
          fi
          [ -n "$cmd" ] || { echo "::error::the run names no command"; exit 64; }
          case $minutes in '' | *[!0-9]*) minutes=15 ;; esac
          key=$(sh tools/compiler_paths.sh --key)
          full=1
          # `builder: <key>` — the merge-base's published compiler stands, and this tree's is never built.
          if [ -n "$builder" ]; then key=$builder; full=0; fi
          printf '%s' "$cmd" | base64 -w0 > "$RUNNER_TEMP/cmd.b64"
          {
            echo "lane=$lane"
            echo "minutes=$minutes"
            echo "key=avrac-$key"
            echo "full=$full"
          } >> "$GITHUB_OUTPUT"
          echo "lane-run: $lane, bound ${minutes} min, compiler avrac-$key$([ "$full" = 1 ] || echo ' (builder)'): $(printf '%s' "$cmd" | head -n 1 | cut -c1-200)"
      # A TREE BUILT ON PROGRAM IS BUILT FROM PROGRAM'S COMPILER, as gate.yml builds it: main's would climb
      # program's rungs from a compiler that refuses program's own source. A tree is program's where its
      # merge-base with program holds a commit main lacks; it then lays down the gate-builder release,
      # which stands as its compiler where the compiler source is the release's, and builds generations 1
      # and 2 from it where it is not. Any other tree takes its compiler as before.
      - id: program
        name: program's compiler
        timeout-minutes: 56
        env:
          LLVM_PREFIX: /usr/lib/llvm-22
          FULL: ${{ steps.order.outputs.full }}
        run: |
          # GitHub's compare answers a merge-base and how far past main it stands; a question it can't answer
          # is said, and the tree takes its compiler as before
          asked() {
            curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$1" | python3 -c "import json, sys; print(json.load(sys.stdin)$2)"
          }
          head=$(git rev-parse HEAD)
          base=$(asked "program...$head" '["merge_base_commit"]["sha"]') || { echo "lane-run: GitHub did not answer this tree's merge-base with program — its compiler as before"; exit 0; }
          ahead=$(asked "main...$base" '["ahead_by"]') || { echo "lane-run: GitHub did not answer how far $base stands past main — its compiler as before"; exit 0; }
          if [ "$ahead" -gt 0 ] 2>/dev/null; then :; else echo "lane-run: a tree of main's (its merge-base with program, $base, is main's) — its compiler as before"; exit 0; fi
          echo "lane-run: a tree of program's (merge-base $base, $ahead commit(s) past main) — program's compiler"
          echo "program=1" >> "$GITHUB_OUTPUT"
          # EVERY FAILURE HERE IS SAID HERE, the step that failed named, and the run ends 70 before the command
          refused() { echo "::error::lane-run: $1"; exit 70; }
          curl -fsSL --retry 3 -o gate-builder.tar.gz https://github.com/avra-lang/avra/releases/download/gate-builder/compiler.tar.gz \
            || refused "the gate-builder release did not download — this tree of program's has no compiler"
          gzip -t gate-builder.tar.gz || refused "the gate-builder release did not download whole"
          have=$(tar -xzOf gate-builder.tar.gz build/.avra-built-from | cut -d' ' -f1)
          if [ "$FULL" = 0 ]; then
            # THE BUILDER of a tree of program's is its merge-base's own compiler: the release's where it was
            # built from that source, else that source's generations 1 and 2 built from it; never this tree's
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch -q --depth=1 origin "$base" || refused "the merge-base $base did not fetch"
            mb="$RUNNER_TEMP/merge-base"
            git worktree add -q --detach "$mb" "$base" || refused "the merge-base $base did not check out"
            want=$(sh tools/work compiler-hash "$mb")
            mkdir -p build
            if [ "$have" = "$want" ]; then
              tar -xzf gate-builder.tar.gz build/avra build/.avra-built-from
              echo "lane-run: the gate-builder release is the merge-base's compiler — it stands as the builder"
            else
              echo "lane-run: the gate-builder release was built from compiler source $have, the merge-base's is $want — its generations 1 and 2 built from it, as the builder"
              tar -xzf gate-builder.tar.gz -C "$mb" build/avra build/.avra-built-from
              for g in 1 2; do
                (cd "$mb" && make -s avra) > "$RUNNER_TEMP/merge-base-gen$g.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/merge-base-gen$g.log"; refused "generation $g of the merge-base's compiler source did not build from the gate-builder release"; }
              done
              cp -p "$mb/build/avra" build/avra
              cp -p "$mb/build/.avra-built-from" build/.avra-built-from
            fi
          elif sh tools/gate.sh unpack gate-builder.tar.gz; then
            echo "lane-run: the gate-builder release stands as this tree's compiler; nothing built"
          else
            echo "lane-run: the gate-builder release was built from compiler source $have, this tree's is another — generations 1 and 2 built from it"
            tar -xzf gate-builder.tar.gz build/avra
            sh tools/gate.sh seed || { find build/gate/pack -type f -exec sh -c 'echo "== $1"; tail -n 60 "$1"' _ {} \; ; refused "this tree's compiler source did not build from the gate-builder release (generations 1 and 2, tools/gate.sh seed)"; }
          fi
          build/avra --version
      # THE LANE'S OWN SAVE FIRST, then main's for this key, then the lane's newest, then main's newest.
      - id: compiler
        if: steps.program.outputs.program != '1'
        uses: ./.github/actions/compiler
        timeout-minutes: 56
        with:
          key: ${{ steps.order.outputs.key }}
          cache-key: lane-${{ steps.order.outputs.lane }}-${{ steps.order.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            lane-${{ steps.order.outputs.lane }}-${{ steps.order.outputs.key }}-
            ${{ steps.order.outputs.key }}
            lane-${{ steps.order.outputs.lane }}-avrac-
            avrac-
          full: ${{ steps.order.outputs.full }}
          rungs: ${{ steps.order.outputs.full == '1' }}
      # THE TRUNKS, BESIDE THE SNAPSHOT: its checkout holds its own history alone, so a command that asks where
      # the tree leaves its trunk (tools/gate_changed.sh) finds origin/program and origin/main, fifty deep, and
      # the snapshot's own line as deep; a trunk that does not fetch is said, and the command runs without it
      - name: trunk refs
        timeout-minutes: 5
        run: |
          for t in program main; do
            git fetch -q --depth=50 origin "+refs/heads/$t:refs/remotes/origin/$t" || echo "lane-run: origin/$t did not fetch — the command runs without it"
          done
          git fetch -q --deepen=30 origin "$(git rev-parse HEAD)" 2>/dev/null || git fetch -q --deepen=30 2>/dev/null || :
          for t in program main; do
            b=$(git merge-base HEAD "origin/$t" 2>/dev/null) && echo "lane-run: origin/$t stands, its merge-base $b" || echo "lane-run: origin/$t names no merge-base within this history"
          done
      - name: libraries
        timeout-minutes: 15
        run: |
          s=0
          eval "$(sh tools/work libs-step)"
          exit "$s"
      # THE COMMAND, bounded: `timeout` answers 124 past the bound, as a Sprite's run does.
      - name: command
        run: |
          export LLVM_PREFIX=/usr/lib/llvm-22
          export AVRA_CAP_MB=$(awk '/^MemTotal:/ { print int($2 / 1024) - 1200 }' /proc/meminfo)
          base64 -d "$RUNNER_TEMP/cmd.b64" > "$RUNNER_TEMP/cmd.sh"
          st=0
          timeout -k 10 "$(( ${{ steps.order.outputs.minutes }} * 60 ))" bash -l "$RUNNER_TEMP/cmd.sh" || st=$?
          echo "lane-run: status $st"
          exit "$st"
      - if: always() && steps.compiler.outcome == 'success'
        uses: ./.github/actions/prune-cache
      - if: always() && steps.compiler.outcome == 'success'
        id: save
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            build/avra
            .avra-cache
          key: lane-${{ steps.order.outputs.lane }}-${{ steps.order.outputs.key }}-${{ github.run_id }}
      # ONE SAVE PER LANE: the repository's caches share one cap, and main's compiler is among them.
      - if: always() && steps.save.outcome == 'success'
        name: drop the lane's older saves
        continue-on-error: true
        env:
          PREFIX: lane-${{ steps.order.outputs.lane }}-avrac-
          KEEP: -${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          api = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/caches"
          head = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          ask = lambda url, method="GET": urllib.request.urlopen(urllib.request.Request(url, headers=head, method=method))
          caches = json.load(ask(f"{api}?key={os.environ['PREFIX']}&per_page=100"))["actions_caches"]
          for c in caches:
              if c["key"].startswith(os.environ["PREFIX"]) and not c["key"].endswith(os.environ["KEEP"]):
                  ask(f"{api}/{c['id']}", "DELETE")
                  print(f"dropped {c['key']}")
          PY
