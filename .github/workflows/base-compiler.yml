# A BASE BRANCH'S COMPILER, PUBLISHED. A branch that carries `Rung:` commits ahead of main cannot be
# read by main's compiler, so a lane off it has no builder (`work run --builder`, `make try`). A push
# to a base climbs its ladder once (.github/actions/compiler), publishes the product under the
# compiler key (tools/compiler_release.py) and every lane on that base stands on it. The bases are
# the branches listed below; `tools/work` reads this list. A key already published builds nothing.
name: base-compiler

on:
  push:
    branches: [hd-clean, hd-gate, hd-builder]
  workflow_dispatch:

concurrency:
  group: base-compiler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avra-lang/avra-ci:llvm22
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      options: --cap-add=SYS_PTRACE
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - id: key
        run: |
          git config --global --add safe.directory "$PWD"
          key=$(sh tools/compiler_paths.sh --key)
          echo "key=avrac-$key" >> "$GITHUB_OUTPUT"
          if python3 tools/compiler_release.py probe "$key"; then
            echo "published=1" >> "$GITHUB_OUTPUT"
            echo "base-compiler: avrac-$key is published — nothing to build"
          else
            echo "published=0" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.published != '1'
        id: compiler
        uses: ./.github/actions/compiler
        timeout-minutes: 100
        with:
          key: ${{ steps.key.outputs.key }}
          cache-key: base-${{ steps.key.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.key.outputs.key }}
            base-avrac-
            avrac-
          full: "1"
      - if: steps.key.outputs.published != '1'
        name: publish
        run: |
          chmod +x build/avra
          build/avra --version
          python3 tools/compiler_release.py publish "${{ steps.key.outputs.key }}" build/avra
      - if: always() && steps.compiler.outcome == 'success'
        uses: ./.github/actions/prune-cache
      - if: always() && steps.compiler.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            build/avra
            .avra-cache
          key: base-${{ steps.key.outputs.key }}-${{ github.run_id }}
