# THE DETERMINISTIC WATCHER. No LLM, one pass every five minutes — GitHub's
# floor for a schedule, best-effort — and after every `checks` or `auto-merge`
# run and every push to `main`. There is NO merge queue: `main` requires the
# `test` check AND that a branch be up to date with it, so the watcher's job is
# to keep every open PR able to merge itself:
#   a PR whose `test` failed is told the exact failing `job — line` and has its
#   failed jobs re-run once; a green, mergeable PR has auto-merge ARMED; a
#   green PR behind `main` has its branch REFRESHED (`gh pr update-branch`) so
#   "up to date" is met without a human; a conflicted PR is told the rebase its
#   owner owes; a draft is named; a run whose PR closed is cancelled. The
#   decision is a pure function proved against fixtures
#   (tools/pr_watcher.py --self-test), so this job is the same answer every
#   pass. Every comment carries its own dedup marker, so a stale state file
#   can never re-post one.
#
# A token a workflow holds with the repository's GITHUB_TOKEN does not start a
# new workflow for the events it causes; arming auto-merge is cheap either
# way, but a merge by the repository's GITHUB_TOKEN does not run the `push`
# runs that publish the compiler. So when the repo has a PAT or app token it
# is used (`AVRA_QUEUE_TOKEN`), and the GITHUB_TOKEN is the fallback.
name: pr-watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: [checks, auto-merge]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

# One watcher at a time: two passes racing would double an action.
concurrency:
  group: pr-watcher
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/pr_watcher.py }
      - name: self-test
        run: python3 tools/pr_watcher.py --self-test
      # THE STATE IS RESTORED AND SAVED AS TWO EXPLICIT STEPS, the pattern
      # checks.yml proves. The combined action's post-step save has been
      # denied ("token has no writable scopes") on this workflow, so the
      # state froze and every pass re-commented; the save runs `always()` so
      # a failed pass still records what it did. The comments carry their own
      # dedup markers too, so correctness never rests on this cache.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.avra-pr-watcher
          key: pr-watcher-${{ github.run_id }}
          restore-keys: pr-watcher-
      - env:
          GH_TOKEN: ${{ secrets.AVRA_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/pr_watcher.py
      - if: always()
        name: save state
        uses: actions/cache/save@v4
        with:
          path: ~/.avra-pr-watcher
          key: pr-watcher-${{ github.run_id }}
