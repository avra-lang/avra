# THE DETERMINISTIC WATCHER. No LLM, one pass every five minutes — GitHub's
# floor for a schedule, best-effort — and after every `checks` or `auto-merge`
# run and every push to `main`. There is NO merge queue: `main` requires the
# `test` check AND that a branch be up to date with it, so the watcher's job is
# to keep every open PR able to merge itself:
#   a PR whose `test` failed is told the exact failing `job — line` and has its
#   failed jobs re-run once; a green, mergeable PR has auto-merge ARMED; a
#   green PR behind `main` has its branch REFRESHED (`gh pr update-branch`) so
#   "up to date" is met without a human; a conflicted PR is told the rebase its
#   owner owes; a draft is named; a run whose PR closed is cancelled. The
#   decision is a pure function proved against fixtures
#   (tools/pr_watcher.py --self-test), so this job is the same answer every
#   pass. Every comment carries its own dedup marker, so a stale state file
#   can never re-post one.
#
# A token a workflow holds with the repository's GITHUB_TOKEN does not start a
# new workflow for the events it causes; arming auto-merge is cheap either
# way, but a merge by the repository's GITHUB_TOKEN does not run the `push`
# runs that publish the compiler. So when the repo has a PAT or app token it
# is used (`AVRA_QUEUE_TOKEN`) for the few WRITES that must start workflows (arming, update-branch: WRITE_TOKEN), and the
# GITHUB_TOKEN answers every read and every other call (GH_TOKEN); that token is the owner's own, shared with every lane.
name: pr-watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: [checks, auto-merge]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

# One watcher at a time: two passes racing would double an action.
concurrency:
  group: pr-watcher
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/pr_watcher.py }
      - name: self-test
        run: python3 tools/pr_watcher.py --self-test
      # THE STATE LIVES ON A BRANCH, never in the Actions cache. A `workflow_run` pass (nearly
      # every pass) is denied cache writes ("token has no writable scopes"), so the state froze
      # and every pass re-told and re-refreshed; a push to a branch is allowed. `watcher-state`
      # holds one commit with one file, replaced each pass. The comments carry their own dedup
      # markers too, so correctness never rests on this state.
      - name: restore state
        run: |
          mkdir -p ~/.avra-pr-watcher
          if git fetch -q --depth=1 origin watcher-state 2>/dev/null && git cat-file -e FETCH_HEAD:state.json 2>/dev/null; then
            git show FETCH_HEAD:state.json > ~/.avra-pr-watcher/state.json
            echo "state restored: $(wc -c < ~/.avra-pr-watcher/state.json) bytes"
          else
            echo "state: none kept yet"
          fi
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRITE_TOKEN: ${{ secrets.AVRA_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 -u tools/pr_watcher.py --follow
      - if: always()
        name: save state
        run: |
          [ -f ~/.avra-pr-watcher/state.json ] || { echo "state: nothing to save"; exit 0; }
          blob=$(git hash-object -w ~/.avra-pr-watcher/state.json)
          tree=$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)
          commit=$(GIT_AUTHOR_NAME=pr-watcher GIT_AUTHOR_EMAIL=pr-watcher@users.noreply.github.com \
            GIT_COMMITTER_NAME=pr-watcher GIT_COMMITTER_EMAIL=pr-watcher@users.noreply.github.com \
            git commit-tree "$tree" -m "pr-watcher state")
          git push -q --force origin "$commit:refs/heads/watcher-state"
          echo "state saved: $(wc -c < ~/.avra-pr-watcher/state.json) bytes"
      # A DEAD WATCHER IS LOUD. A failed pass opens (or comments on) one sticky issue naming the
      # run and its last error line; the next clean pass closes it. A watcher that failed for
      # two hours once, silently, and nothing landed or published.
      - if: failure()
        name: say the watcher failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="pr-watcher failed: $RUN"
          n=$(gh issue list --label pr-watcher-failing --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "pr-watcher is failing" --label pr-watcher-failing --body "$body" || gh issue create --title "pr-watcher is failing" --body "$body"; fi
      - if: success()
        name: close the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --label pr-watcher-failing --state open --json number --jq '.[].number'); do gh issue close "$n" --comment "a pass ran clean: $GITHUB_RUN_ID"; done
