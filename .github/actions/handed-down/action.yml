# WHAT PREPARE BUILT, IN A JOB THAT RUNS IT: the compiler and the hand-down
# tar laid back newer than this checkout's sources (tools/hand_down.sh), and
# the room the runner has. Every job that runs programs starts here.
name: handed-down
description: The compiler and the C objects a prepare job built, unpacked.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with: { name: avra-compiler, path: build }
    - uses: actions/download-artifact@v4
      with: { name: avra-build }
    - name: built
      shell: sh
      run: sh tools/hand_down.sh unpack
