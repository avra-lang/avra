# THE RUN'S ONE WISP: the binary the workflow's first job built (`./wisp --path`) and uploaded as
# `wisp`, laid where ./wisp finds it first (build/wisp/<key>/wisp). A job takes it here and builds,
# fetches or hands down none of its own (`wisp ci_invariants`' wisp-route).
name: wisp
description: The run's one wisp, where ./wisp finds it first
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with: { name: wisp, path: build/wisp }
    - shell: sh
      run: |
        chmod +x build/wisp/*/wisp
        echo "wisp: $(ls build/wisp/*/wisp)"
